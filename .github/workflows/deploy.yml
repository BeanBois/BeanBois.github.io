name: Deploy

# main is the site. Every design/<name> branch is built too, as a preview at /preview/<name>/.
on:
  push:
    branches: [main, "design/**"]
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the colophon's printing number is the commit count
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Build main and every design branch
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir site
          git worktree add -q "$RUNNER_TEMP/main" origin/main
          (cd "$RUNNER_TEMP/main" && python build.py)
          cp -r "$RUNNER_TEMP/main/dist/." site/
          for b in $(git branch -r --format='%(refname:short)' | grep '^origin/design/' || true); do
            slug="${b#origin/design/}"
            git worktree add -q "$RUNNER_TEMP/b-$slug" "$b"
            (cd "$RUNNER_TEMP/b-$slug" && PREVIEW="$slug" python build.py)
            mkdir -p "site/preview/$slug"
            cp -r "$RUNNER_TEMP/b-$slug/dist/." "site/preview/$slug/"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
