<style>
/* Layout: a blank page and the Poincaré ball, nothing else. Kai Shun is the centre; four skill anchors sit at the
   corners of a tetrahedron and every project is placed by its skill mix. Clicking a point opens a speech bubble
   beside it, and the ball slides aside to make room. Ink on paper, one red spot colour for flows. */
:root {
  --paper: #ffffff;
  --ink: #111111;
  --tone: #8a8a8a;
  --soft: #e2e2e2;
  --muted: #555555;
  --spot: #d7262e;
  --font-display: "Dela Gothic One", "Arial Black", Impact, system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d0d0d; --ink: #f1f1f1; --tone: #6d6d6d; --soft: #262626; --muted: #a9a9a9; --spot: #ff4b52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d0d0d; --ink: #f1f1f1; --tone: #6d6d6d; --soft: #262626; --muted: #a9a9a9; --spot: #ff4b52;
  color-scheme: dark;
}

html, body { height: 100%; overflow: hidden; margin: 0; }

  font: 15px/1.6 var(--font-body);

  padding-right: max(16px, env(safe-area-inset-right, 0px));

}

#ball.dragging { cursor: grabbing; }
button:focus-visible, a:focus-visible, canvas:focus-visible { outline: 3px solid var(--spot); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the speech bubble: positioned by script beside the selected point, tail aimed at it */

  padding: 22px 26px 26px; overflow: auto; overscroll-behavior: contain;

@media (prefers-reduced-motion: reduce) { .say { animation: none; } }

.path { font: 12px var(--font-mono); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.mast { position: fixed; z-index: 2; left: max(20px, calc(env(safe-area-inset-left, 0px) + 12px)); top: calc(env(safe-area-inset-top, 0px) + 18px); display: grid; gap: 2px; pointer-events: none; }

/* 7-3: the record takes the left 70%, a rail the right 30%. The rail holds who, what's playing, the open
   project (or an intro) and the way into the volume, so clicking never moves the record. */
.intro { display: none; }
@media (min-width: 900px) {

    padding: calc(env(safe-area-inset-top, 0px) + 40px) calc(env(safe-area-inset-right, 0px) + 32px) calc(env(safe-area-inset-bottom, 0px) + 28px) 36px;
  }
  .rail .mast, .rail .mastnav { position: static; pointer-events: auto; }

  .rail .np .lbl, .rail .np .by, .rail .np .bpm { display: block; }
  .rail .np b { display: block; margin: 4px 0 2px; font-size: 19px; line-height: 1.2; }

  .rail .intro { display: block; flex: 1; min-height: 0; }

  .rail .mastnav { flex-direction: column; gap: 6px; font-size: 13px; padding-top: 14px; border-top: 1.5px solid var(--soft); }
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .rail .say { animation: none; } }
.np .by::before { content: "· "; }
.np .bpm::before { content: "· "; }
@media (min-width: 900px) { .rail .np .by::before, .rail .np .bpm::before { content: none; } }
.meter { display: block; width: 160px; height: 18px; margin-top: 6px; }
.np .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--spot); margin-right: 6px; vertical-align: 1px; }
.np button { font: inherit; color: var(--muted); background: none; border: 0; border-bottom: 1px dashed var(--tone); padding: 0; margin-left: 8px; cursor: pointer; }

<script>
const D = /*__DATA__*/null;

/* ---------- vectors and the Poincaré ball ---------- */
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const plus = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const minus = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const times = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const len = a => Math.hypot(a[0], a[1], a[2]);
const unit = a => { const l = len(a); return l < 1e-12 ? [0, 0, 1] : times(a, 1 / l); };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const neg = a => times(a, -1);
// Möbius addition in the ball: the hyperbolic translation taking 0 to a, applied to x
function madd(a, x) {
  const ax = dot(a, x), a2 = dot(a, a), x2 = dot(x, x);
  const den = 1 + 2 * ax + a2 * x2;
  return times(plus(times(a, 1 + 2 * ax + x2), times(x, 1 - a2)), 1 / den);
}
// point at fraction s along the geodesic p → q
function geo(p, q, s) {
  const d = madd(neg(p), q), m = len(d);
  if (m < 1e-9) return p;
  return madd(p, times(d, Math.tanh(s * Math.atanh(Math.min(m, 0.999999))) / m));
}
const dH = (x, y) => Math.acosh(1 + (2 * dot(minus(x, y), minus(x, y))) / ((1 - dot(x, x)) * (1 - dot(y, y))));
// 3×3 rotation matrices, row-major
const mmul = (A, B) => { const C = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) C.push(A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j]); return C; };
const mv = (M, v) => [M[0] * v[0] + M[1] * v[1] + M[2] * v[2], M[3] * v[0] + M[4] * v[1] + M[5] * v[2], M[6] * v[0] + M[7] * v[1] + M[8] * v[2]];
const mtv = (M, v) => [M[0] * v[0] + M[3] * v[1] + M[6] * v[2], M[1] * v[0] + M[4] * v[1] + M[7] * v[2], M[2] * v[0] + M[5] * v[1] + M[8] * v[2]];
const rotX = a => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, s, 0, -s, c]; };
const rotY = a => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
// rotation by angle a about a unit axis (Rodrigues, right-handed). Note rotX(a) is the right-handed rotation by −a.
function rotAxis(k, a) {
  const [x, y, z] = k, c = Math.cos(a), s = Math.sin(a), t = 1 - c;
  return [t * x * x + c, t * x * y - s * z, t * x * z + s * y,
          t * x * y + s * z, t * y * y + c, t * y * z - s * x,
          t * x * z - s * y, t * y * z + s * x, t * z * z + c];
}

/* ---------- anchors and placement ---------- */
// Four skills at the corners of a tetrahedron: every pair is equally far apart.
const S3 = 1 / Math.sqrt(3);
const ANCHOR = { ml: [S3, S3, S3], backend: [S3, -S3, -S3], infra: [-S3, S3, -S3], product: [-S3, -S3, S3] };
const ANAME = { ml: "ML", backend: "BACKEND", infra: "INFRA", product: "PRODUCT" };
const DEPTH = 0.9;      // r = 0.9·|p|, so a single-skill project sits deep but not on the boundary

const nodes = D.nodes.map(n => ({ ...n }));
const byId = new Map(nodes.map(n => [n.id, n]));
const placed = [];
for (const n of nodes) {
  let p = [0, 0, 0];
  for (const [k, w] of Object.entries(n.mix)) p = plus(p, times(ANCHOR[k], w));
  const L = len(p), dir = unit(p), r = DEPTH * L;
  let pos = times(dir, r);
  // projects with the same mix would sit on one point: fan them out tangentially, golden-angle steps
  const twins = placed.filter(q => len(minus(q.base, pos)) < 0.04).length;
  let spread = 0;
  if (twins) {
    const ref = Math.abs(dir[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    const t1 = unit(cross(ref, dir)), t2 = cross(dir, t1);
    const a = twins * 2.39996, m = 0.085 * Math.sqrt(twins);
    pos = plus(pos, plus(times(t1, Math.cos(a) * m), times(t2, Math.sin(a) * m)));
    if (len(pos) > 0.94) pos = times(unit(pos), 0.94);
    spread = m;
  }
  n.calc = { p, L, r, spread, twins };
  n.z = pos;
  placed.push({ base: times(dir, r) });
}
// Kai Shun, at the origin
const ME = { id: "me", me: true, title: D.profile.name, z: [0, 0, 0] };
// group headers (a job) and group members
const groups = {};
for (const n of nodes) if (n.group) (groups[n.group] ||= { id: n.group, members: [] }).members.push(n);
for (const g of Object.values(groups)) {
  const head = D.groups[g.id];
  const lead = byId.get(g.id);
  g.title = head ? head.title : lead.title;
  g.header = head || null;
  if (lead && !g.members.includes(lead)) g.members.unshift(lead);
  let c = [0, 0, 0];
  for (const m of g.members) c = plus(c, m.z);
  g.z = times(c, 1 / g.members.length);
}

/* ---------- state ---------- */
let centre = [0, 0, 0];
let rot = mmul(rotX(-0.45), rotY(0.65));
// the spin: the ball always turns slowly; a flick throws it, and it settles back to the idle spin
const IDLE = times(unit([0.18, 1, 0.08]), 0.14);          // rad/s, a tilted axis like a thrown steel ball
let omega = [...IDLE], lastFrame = performance.now();
let anim = null;           // a rotation in progress (unused for now)
let trip = null, queue = [];   // a flight through the ball in progress; every flight goes by way of the centre
let sel = null;            // a node, ME, or a group
let hover = null;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
// the record: when the page knows what Kai Shun is listening to (D.music), the ball is also a vinyl.
// The label at the centre turns at 33⅓ rpm while a song plays, the tonearm follows the song's progress,
// and each beat sends one faint ring out through the grooves. No music data: the plain steel ball.
const RPM = 100 / 3;
// Clicking a project changes the record: the needle lifts and the record fades while the ball travels, then the
// record goes on again at the point (now the centre) and its cover spreads out from there as a faint circle.
// It plays the project's playlist (D.playlists) if it has one, otherwise Kai Shun's own listening (D.music).
const homeMusic = D.music ? { ...D.music, key: "me", at: performance.now() } : null;
let music = homeMusic;
// a visitor arrives mid-song: the platter is already turning and the needle already down
const rec = { phase: 0, speed: music && music.is_playing && !reduce ? RPM * Math.PI / 30 : 0, arm: music && music.is_playing ? 1 : 0,
              vis: 1, on: ME, target: ME, art: null, revealAt: -1e9, cache: new Map() };
const songAt = now => !music ? 0 : Math.min(music.duration_ms, music.progress_ms + (music.is_playing ? now - music.at : 0)) / 1000;

/* ---------- colours and fonts from tokens ---------- */
let col = {}, fonts = {}, toneFill = null;
const cv = document.getElementById("ball");
const ctx = cv.getContext("2d");
function readColours() {
  const cs = getComputedStyle(document.documentElement);
  for (const t of ["--paper", "--ink", "--tone", "--soft", "--muted", "--spot"]) col[t] = cs.getPropertyValue(t).trim();
  for (const t of ["--font-display", "--font-mono"]) fonts[t] = cs.getPropertyValue(t).trim();
  const p = document.createElement("canvas"); p.width = p.height = 5;
  const pc = p.getContext("2d");
  pc.fillStyle = col["--paper"]; pc.fillRect(0, 0, 5, 5);
  pc.fillStyle = col["--ink"]; pc.beginPath(); pc.arc(2.5, 2.5, 1.1, 0, Math.PI * 2); pc.fill();
  toneFill = ctx.createPattern(p, "repeat");
  if (music) { rec.cache.clear(); rec.art = artFor(music); }
  draw();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColours);
new MutationObserver(readColours).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
document.fonts?.ready.then(() => draw());

/* ---------- layout: the ball alone, or the ball beside a speech bubble ---------- */
const sayEl = document.getElementById("say");
let W = 0, H = 0, dpr = 1;

      const k = 2.4 / R, t = performance.now(), dtm = Math.max(8, t - (drag.t || t - 16)) / 1000;
      const ax = (ev.clientY - drag.ly) * k, ay = (ev.clientX - drag.lx) * k;
      rot = mmul(mmul(rotX(ax), rotY(ay)), rot);
      drag.w = plus(times(drag.w || [0, 0, 0], 0.5), times([-ax / dtm, ay / dtm, 0], 0.5));   // right-handed angular velocity
      drag.lx = ev.clientX; drag.ly = ev.clientY; drag.t = t;
      kick();
    }
    return;
  }
  const h = hitAt(ev);
  if (h !== hover) { hover = h; cv.style.cursor = h ? "pointer" : ""; kick(); }
});
cv.addEventListener("pointercancel", ev => { touches.delete(ev.pointerId); if (touches.size < 2) pinch = null; drag = null; });
cv.addEventListener("pointerup", ev => {
  touches.delete(ev.pointerId);
  if (pinch != null) { if (touches.size < 2) pinch = null; drag = null; return; }
  const wasDrag = drag && drag.moved;
  if (wasDrag && !reduce) {
    // release: the ball keeps the spin you gave it, unless you stopped before letting go
    const fresh = performance.now() - (drag.t || 0) < 80;
    omega = fresh && drag.w ? times(drag.w, Math.min(1, 14 / Math.max(1e-6, len(drag.w)))) : [...IDLE];
  }
  drag = null; cv.classList.remove("dragging");
  if (wasDrag) return;
  const h = hitAt(ev);
  touched = true;
  if (h && h.members && !h.title) openPick(h, ev.clientX, ev.clientY);      // a cluster: list what's in it
  else if (h) select(h);
  else if (!sayEl.hidden) closeSay();      // a click on blank paper closes the bubble
});
cv.addEventListener("pointerleave", () => { if (!drag) { hover = null; kick(); } });
addEventListener("keydown", ev => {
  if (ev.key === "Escape") { if (!pickEl.hidden) return closePick(); if (!sayEl.hidden) closeSay(); }
  if (document.activeElement !== cv) return;
  const step = 0.12, keys = { ArrowLeft: rotY(-step), ArrowRight: rotY(step), ArrowUp: rotX(-step), ArrowDown: rotX(step) };
  if (keys[ev.key]) { ev.preventDefault(); rot = mmul(keys[ev.key], rot); kick(); }
  if (ev.key === "Enter") select(ME);
});

/* ---------- the record ---------- */
const labelR = (v, s) => Math.max(14, R * 0.13 * conf(v) * s.s);
// where a project's name tag sits: on its point, or just under the label while its record is on
function tagAt(n, pos) {
  const p = pos.get(n);
  if (!(music && n === rec.on && rec.vis > 0.5)) return p;
  return { v: p.v, s: { ...p.s, y: p.s.y + labelR(p.v, p.s) + 16 } };
}
// what plays when a project is clicked: one song from its playlist, started somewhere in the middle
function trackFor(n) {
  if (n === ME) return homeMusic;
  const pl = D.playlists && D.playlists[n.id];
  if (!pl || !pl.tracks.length) return homeMusic;
  const t = pl.tracks[Math.floor(Math.random() * pl.tracks.length)];
  return { ...t, key: n.id, playlist: pl.name, url: pl.url || t.url, art: pl.art, sample: pl.sample, is_playing: true,
           progress_ms: Math.random() * 0.6 * t.duration_ms, at: performance.now() };
}
// a stand-in cover for the prototype, different for every key: real covers replace it at build time
function standInCover(g, N, key) {
  let h = 0; for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) % 360;
  g.fillStyle = `hsl(${h} 45% 42%)`; g.fillRect(0, 0, N, N);
  g.fillStyle = `hsl(${(h + 150) % 360} 65% 62%)`; g.beginPath(); g.arc(N * (0.3 + (h % 40) / 100), N * 0.42, N * 0.24, 0, Math.PI * 2); g.fill();
  g.fillStyle = `hsl(${(h + 40) % 360} 55% 20%)`; g.beginPath(); g.moveTo(0, N * 0.72); g.lineTo(N, N * 0.52); g.lineTo(N, N); g.lineTo(0, N); g.fill();
}
// one track's art: the cover in colour (shown big and faint behind the grooves) and the label (the cover as screentone)
function artFor(m) {
  const key = m.key + "|" + (m.art || m.title || "") + (m.is_playing ? ":on" : ":off");
  if (rec.cache.has(key)) return rec.cache.get(key);
  const N = 320, cover = document.createElement("canvas"); cover.width = cover.height = N;
  const cg = cover.getContext("2d");
  const img = m.art ? Object.assign(new Image(), { crossOrigin: "anonymous", src: m.art }) : null;   // the cover is re-served with CORS so it can be read
  const paint = () => {
    if (img && img.complete && img.naturalWidth) cg.drawImage(img, 0, 0, N, N); else standInCover(cg, N, m.key);
    try { out.label = halftoneLabel(cover, N, m.is_playing); }
    catch { standInCover(cg, N, m.key); out.label = halftoneLabel(cover, N, m.is_playing); }   // an unreadable image: fall back
  };
  const out = { cover, label: null };
  paint();
  if (img && !img.complete) img.onload = paint;
  rec.cache.set(key, out);
  return out;
}
function halftoneLabel(src, N, live) {
  const c = document.createElement("canvas"); c.width = c.height = N;
  const g = c.getContext("2d");
  const px = src.getContext("2d").getImageData(0, 0, N, N).data;
  g.fillStyle = col["--paper"]; g.fillRect(0, 0, N, N);
  g.fillStyle = col["--ink"];
  const step = 9;
  for (let y = 0, row = 0; y < N; y += step * 0.87, row++) for (let x = (row % 2) * step / 2; x < N; x += step) {
    const i = (Math.floor(y) * N + Math.floor(x)) * 4, lum = (0.3 * px[i] + 0.59 * px[i + 1] + 0.11 * px[i + 2]) / 255;
    const r = step * 0.56 * Math.sqrt(1 - lum);
    if (r > 0.4) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
  }
  // the label's rim, printed like a real one; the dot is red while the song is live
  g.fillStyle = col["--paper"]; g.beginPath(); g.arc(N / 2, N / 2, N / 2, 0, Math.PI * 2); g.arc(N / 2, N / 2, N * 0.4, 0, Math.PI * 2, true); g.fill();
  g.strokeStyle = col["--ink"]; g.lineWidth = 3; g.beginPath(); g.arc(N / 2, N / 2, N * 0.4, 0, Math.PI * 2); g.stroke();
  const rim = "TEOH KAI SHUN · SIDE A · 33⅓ RPM · ";
  g.font = `600 ${N * 0.05}px ${fonts["--font-mono"]}`; g.fillStyle = col["--ink"]; g.textAlign = "center"; g.textBaseline = "middle";
  [...rim].forEach((ch, k) => { const a = (k / rim.length) * Math.PI * 2; g.save(); g.translate(N / 2 + Math.cos(a) * N * 0.45, N / 2 + Math.sin(a) * N * 0.45); g.rotate(a + Math.PI / 2); g.fillText(ch, 0, 0); g.restore(); });
  if (live) { g.fillStyle = col["--spot"]; g.beginPath(); g.arc(N / 2, N * 0.08, N * 0.022, 0, Math.PI * 2); g.fill(); }
  return c;
}
function drawLabel(x, y, r) {
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
  ctx.translate(x, y); ctx.rotate(rec.phase); ctx.drawImage(rec.art.label, -r, -r, 2 * r, 2 * r); ctx.restore();
  ctx.strokeStyle = col["--ink"]; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = col["--paper"]; ctx.beginPath(); ctx.arc(x, y, Math.max(2, r * 0.07), 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = col["--ink"]; ctx.lineWidth = 1.2; ctx.stroke();
}
function drawGrooves(now) {
  const r0 = R * 0.3, r1 = R * 0.975, V = rec.vis;
  // the cover, cropped to a circle, spreading out from the centre once the record is on; kept faint, and fainter at home
  if (rec.art && V > 0.01) {
    const k = reduce ? 1 : Math.min(1, (now - rec.revealAt) / 1300), e = 1 - Math.pow(1 - k, 3);
    const rr = R * 0.12 + (r1 - R * 0.12) * e;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.clip();
    ctx.globalAlpha = (rec.on === ME ? 0.06 : 0.11) * V;
    ctx.drawImage(rec.art.cover, cx - r1, cy - r1, 2 * r1, 2 * r1);
    ctx.restore();
    if (k < 1) { ctx.globalAlpha = 0.45 * (1 - k) * V; ctx.strokeStyle = col["--ink"]; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke(); }
  }
  ctx.strokeStyle = col["--tone"]; ctx.lineWidth = 0.6;
  ctx.globalAlpha = 0.16 * V;
  ctx.beginPath();
  for (let r = r0, k = 0; r < r1; r += 2.6, k++) {
    if (k % 41 > 38) continue;                    // the quiet bands between tracks
    ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  }
  ctx.stroke();
  // a few glints that turn with the platter, so you can see it spin
  ctx.strokeStyle = col["--ink"]; ctx.lineWidth = 1;
  for (let i = 0; i < 7; i++) {
    const r = r0 + (r1 - r0) * ((i * 0.618) % 1), a = rec.phase * 0.5 + i * 2.4;
    ctx.globalAlpha = 0.12 * V; ctx.beginPath(); ctx.arc(cx, cy, r, a, a + 0.35); ctx.stroke();
  }
  // the beat: one faint ring per beat, out from the label through the grooves; the first of each bar a little stronger
  if (music.is_playing && music.bpm && !reduce) {
    const beats = songAt(now) * music.bpm / 60, f = beats % 1, bar = Math.floor(beats) % 4 === 0;
    const r = r0 + (r1 - r0) * Math.pow(f, 0.7);
    ctx.globalAlpha = (bar ? 0.34 : 0.2) * Math.pow(1 - f, 2) * Math.min(1, rec.speed / (RPM * Math.PI / 30)) * V;
    ctx.strokeStyle = col["--ink"]; ctx.lineWidth = bar ? 2 : 1.4;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
// the tonearm: pivots just above the record's top right edge (clear of the bubble); the stylus rides from the outer groove inward as the song goes on.
// When nothing plays it lifts back to its rest beside the record.
function drawArm(now) {
  const P = [cx + R * 1.0, Math.max(16, cy - R * 0.95)], L = R * 1.06;
  const frac = music.duration_ms ? songAt(now) / (music.duration_ms / 1000) : 0;
  const rr = R * (0.94 - 0.58 * frac);
  // the stylus is where a circle of the arm's length about the pivot meets the groove of radius rr (the right-hand meeting)
  const dx = cx - P[0], dy = cy - P[1], d = Math.hypot(dx, dy);
  const a = (L * L - rr * rr + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L * L - a * a));
  const mx = P[0] + (a * dx) / d, my = P[1] + (a * dy) / d;
  const c1 = [mx - (h * dy) / d, my + (h * dx) / d], c2 = [mx + (h * dy) / d, my - (h * dx) / d];
  const play = c1[0] > c2[0] ? c1 : c2;
  const angRest = 1.4;                                  // resting just off the record's right edge
  let angPlay = Math.atan2(play[1] - P[1], play[0] - P[0]);
  while (angPlay - angRest > Math.PI) angPlay -= 2 * Math.PI;
  while (angPlay - angRest < -Math.PI) angPlay += 2 * Math.PI;
  const ang = angRest + (angPlay - angRest) * rec.arm, S = [P[0] + L * Math.cos(ang), P[1] + L * Math.sin(ang)];
  ctx.lineCap = "round";
  ctx.strokeStyle = col["--paper"]; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(P[0], P[1]); ctx.lineTo(S[0], S[1]); ctx.stroke();
  ctx.strokeStyle = col["--ink"]; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(P[0], P[1]); ctx.lineTo(S[0], S[1]); ctx.stroke();
  ctx.save(); ctx.translate(S[0], S[1]); ctx.rotate(ang);
  ctx.fillStyle = col["--ink"]; ctx.fillRect(-4, -6, 16, 12);
  ctx.restore();
  ctx.fillStyle = col["--paper"]; ctx.strokeStyle = col["--ink"]; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(P[0], P[1], 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col["--ink"]; ctx.beginPath(); ctx.arc(P[0], P[1], 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.lineCap = "butt";
}

/* ---------- the speech bubble ---------- */
const body = document.getElementById("saybody");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1");
const paras = s => s.split(/\n\s*\n/).map(p => `<p>${md(p.replace(/\n/g, " "))}</p>`).join("");
const f2 = x => (x < 0 ? "−" : " ") + Math.abs(x).toFixed(2);
function glyph(n) {
  const st = (STATUS[n.status] || STATUS.archived).style, ink = "var(--ink)", paper = "var(--paper)";
  const shape = n.track === "work" ? `<rect x="1.5" y="1.5" width="9" height="9"` : n.track === "academic" ? `<polygon points="6,0.6 11.4,6 6,11.4 0.6,6"` : `<circle cx="6" cy="6" r="5"`;
  const attrs = {
    solid: `fill="${ink}"`, tone: `fill="url(#tp)" stroke="${ink}" stroke-width="1.5"`, outline: `fill="${paper}" stroke="${ink}" stroke-width="1.8"`,
    faint: `fill="${paper}" stroke="var(--tone)" stroke-width="1.5"`, dashed: `fill="${paper}" stroke="${ink}" stroke-width="1.5" stroke-dasharray="2 2"`,
  }[st];
  const inner = st === "solid" ? `<circle cx="6" cy="6" r="2" fill="var(--spot)"/>` : st === "outline" ? `<circle cx="6" cy="6" r="1.8" fill="${ink}"/>` : "";
  return `<svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><defs><pattern id="tp" width="2.4" height="2.4" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="0.6" fill="${ink}"/></pattern></defs>${shape} ${attrs}/>${inner}</svg>`;
}
const nearest = (n, k) => nodes.filter(m => m !== n).map(m => ({ m, d: dH(n.z, m.z) })).sort((a, b) => a.d - b.d).slice(0, k);
const list = items => `<div class="kids">${items.map(({ m, d }) => `<button type="button" data-go="${m.id}">${glyph(m)}<span><b>${esc(m.title)}</b><small>${esc(m.tagline)}</small></span>${d != null ? `<span class="d">d=${d.toFixed(2)}</span>` : ""}</button>`).join("")}</div>`;

function calcBlock(n) {
  const c = n.calc, terms = Object.entries(n.mix).sort((a, b) => b[1] - a[1]);
  const bars = terms.map(([k, w]) => `<div class="mixrow"><span>${k}</span><span>${w.toFixed(2)}</span><span class="bar"><i style="width:${w * 100}%"></i></span></div>`).join("");
  const sum = terms.map(([k, w]) => `${w.toFixed(2)}·u<sub>${k}</sub>`).join(" + ");
  const dist = 2 * Math.atanh(len(n.z));
  return `<div class="calc">${bars}<div class="eq">p   = ${sum}
    = (${f2(c.p[0])}, ${f2(c.p[1])}, ${f2(c.p[2])})
|p| = <b>${c.L.toFixed(3)}</b>   <span class="c">1 = one skill only; lower = more mixed</span>
r   = ${DEPTH}·|p| = <b>${c.r.toFixed(3)}</b>${c.twins ? `
    + spread ${c.spread.toFixed(3)}   <span class="c">${c.twins} other${c.twins > 1 ? "s" : ""} share this mix</span>` : ""}
d   = 2·atanh(|x|) = <b>${dist.toFixed(2)}</b>   <span class="c">hyperbolic distance from Kai Shun</span></div></div>
<p class="note">u<sub>k</sub> are the four anchors, the corners of a tetrahedron on the ball's boundary. The mix is a draft for Kai Shun to correct.</p>`;
}

function select(n) {
  closePick(); touched = true; clusters = null;

  layout(); flyTo(n.z); kick();
}
function closeSay() { rec.target = ME; closePick(); clusters = null; sel = null; sayEl.hidden = true; layout(); omega = [...IDLE]; goHome(); kick(); }

/* ---------- a plain list for keyboards and screen readers ---------- */
document.getElementById("srlist").innerHTML = `<button type="button" data-go="me">${esc(D.profile.name)}</button>` +
  nodes.map(n => `<button type="button" data-go="${n.id}">${esc(n.title)}</button>`).join("");
document.getElementById("srlist").addEventListener("click", ev => {
  const b = ev.target.closest("[data-go]"); if (b) select(b.dataset.go === "me" ? ME : byId.get(b.dataset.go));
});

const wantId = decodeURIComponent(location.hash.slice(1));
if (wantId === "me" || byId.has(wantId)) setTimeout(() => select(wantId === "me" ? ME : byId.get(wantId)), 500);
/* ---------- the meter: a row of level bars, like a DJ deck's ----------
   There's no audio to analyse (the browser can't hear Kai Shun's phone), so the bars are drawn from the tempo:
   a kick on every beat in the low bars, a hat between beats in the high ones, each bar with its own decay.
   Without a tempo they sway gently; with nothing playing they lie flat. */
const meter = document.getElementById("meter"), mctx = meter.getContext("2d");
const BARS = 28, level = new Float32Array(BARS), peak = new Float32Array(BARS);
let meterLast = performance.now();
function drawMeter(now) {
  const w = meter.clientWidth, h = meter.clientHeight;
  if (!w || !h) return;
  if (meter.width !== Math.round(w * dpr)) { meter.width = Math.round(w * dpr); meter.height = Math.round(h * dpr); }
  const dt = Math.min(0.1, (now - meterLast) / 1000); meterLast = now;
  const live = music && music.is_playing && rec.vis > 0.5;     // quiet while the record is being changed
  const beats = live && music.bpm ? songAt(now) * music.bpm / 60 : now / 1000 * 1.6;
  const f = beats % 1, kick = Math.exp(-f * 7), hat = Math.exp(-((f + 0.5) % 1) * 12);
  for (let i = 0; i < BARS; i++) {
    const x = i / (BARS - 1), wob = 0.5 + 0.5 * Math.sin(now / 1000 * (1.3 + x * 2.7) + i * 1.7);
    let want = 0.04;
    if (live) want = music.bpm ? 0.18 + 0.62 * kick * Math.pow(1 - x, 1.6) + 0.35 * hat * Math.pow(x, 1.4) + 0.22 * wob * (0.4 + 0.6 * Math.sin(x * 3.1))
                               : 0.2 + 0.3 * wob;
    if (reduce) want = live ? 0.25 + 0.35 * Math.sin(x * 3.1) * (1 - x * 0.5) : 0.04;
    level[i] += (want - level[i]) * (want > level[i] ? 1 - Math.exp(-dt * 40) : 1 - Math.exp(-dt * 7));   // fast attack, slow release
    peak[i] = Math.max(level[i], peak[i] - dt * 0.45);
  }
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mctx.clearRect(0, 0, w, h);
  const bw = w / BARS;
  for (let i = 0; i < BARS; i++) {
    const bh = Math.max(1.5, level[i] * h);
    mctx.fillStyle = col["--ink"]; mctx.fillRect(i * bw + 1, h - bh, bw - 2, bh);
    if (live) { mctx.fillStyle = col["--spot"]; mctx.fillRect(i * bw + 1, h - peak[i] * h - 3, bw - 2, 1.5); }   // red peak caps while it's live
  }
}
(function meterLoop(now) { drawMeter(now); requestAnimationFrame(meterLoop); })(performance.now());

document.getElementById("intro").innerHTML = `<p class="lede">${esc(D.profile.oneliner)}</p>
  <p class="hint">Every project I've built sits on this record, placed by the skills it took: ML, Backend, Infra and Product at the corners, mixed projects nearer the middle. Drag to spin it. Click a name.</p>`;
readColours();
requestAnimationFrame(loop);
</script>
