<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%232a1b3d%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%225%22 fill=%22%23d9507f%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%221.5%22 fill=%22%232a1b3d%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: the site is a manga series. The cover (the ball) is home; every project is a volume with its own
   cover and spine; the trade dress (logo, volume number, obi, folio) is the same on all of them and only the
   art changes. Inner pages share one running head and one folio. Ink on paper; red only for what is live. */
:root {
  --font-display: "Dela Gothic One", "Arial Black", Impact, system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --spine-h: 280px;
}
/*__COLOURS__*/
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.7 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
a { color: var(--ink); text-decoration-thickness: 2px; text-decoration-color: var(--live-red); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--live-red); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; }
/* 7-3: every page is a main column (70%) and a rail (30%) that holds what supports it */
.split { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 3fr); gap: 0 56px; align-items: start; margin-top: 32px; }
.split > .rail { position: sticky; top: 24px; display: grid; gap: 22px; align-content: start; max-height: calc(100vh - 48px); overflow: auto; padding-bottom: 8px; }
.split > .rail .pt { margin: 0; display: grid; gap: 10px; }
.split > .rail .pt h1 { font-size: clamp(48px, 5.4vw, 76px); }
.split > .rail .pt p { margin: 0; font-size: 15px; }
.split > .main { padding-top: 6px; }
@media (max-width: 860px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .split > .rail { position: static; max-height: none; order: -1; margin-bottom: 18px; }
  .split.main-first > .rail { order: 0; margin: 40px 0 0; }
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; line-height: 1.1; }
.mono { font-family: var(--font-mono); }
.jp { font-family: var(--font-body); font-weight: 700; }
.muted { color: var(--muted); }

/* Shapes, as on the cover. Circle: a person or something live. Square: something you read. Triangle: direction.
   Organic: art. Depth: every object casts the same flat screentone shadow, and nothing else does. */
body { position: relative; min-height: 100vh; }
.wrap { padding-block: 92px 64px; }
.corners .c { position: absolute; z-index: 5;   /* on the page, not the screen: the bottom corners wait at the end */ display: flex; gap: 2px; background: var(--paper); padding: 5px 9px; font: 13px var(--font-mono); }
.corners a { display: flex; gap: 8px; align-items: center; color: var(--corners-labels); text-decoration: none; }
.corners a b { font: 700 14px var(--font-body); }
.corners i { display: block; flex: none; width: 11px; height: 11px; background: var(--corners-triangles); }
.corners a:hover i, .corners a[aria-current] i { background: var(--corners-current); box-shadow: 0 0 0 2px var(--live-edge); }
.corners a[aria-current] { text-decoration: underline; text-decoration-color: var(--corners-current); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.corners .tl { top: calc(env(safe-area-inset-top, 0px) + 18px); left: calc(env(safe-area-inset-left, 0px) + 22px); flex-direction: column; }
.corners .tl i { clip-path: polygon(0 0, 100% 0, 0 100%); }
.corners .home { font: 400 15px var(--font-display); letter-spacing: 0.02em; }
.corners .part { font: 12px var(--font-mono); color: var(--muted); padding-left: 19px; }
.corners .tr { top: calc(env(safe-area-inset-top, 0px) + 18px); right: calc(env(safe-area-inset-right, 0px) + 22px); }
.corners .tr a, .corners .br a { flex-direction: row-reverse; }
.corners .tr i { clip-path: polygon(0 0, 100% 0, 100% 100%); }
.corners .bl { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: calc(env(safe-area-inset-left, 0px) + 22px); }
.corners .bl i { clip-path: polygon(0 0, 0 100%, 100% 100%); }
.corners .br { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 22px); }
.corners .br i { clip-path: polygon(100% 0, 100% 100%, 0 100%); }
@media (max-width: 860px) {
  .wrap { padding-top: 20px; }
  .corners { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 16px 0 14px; border-bottom: 2px solid var(--ink); }   /* the body's margin is the gutter */
  .corners .c { position: static; padding: 0; background: none; }
  .corners .tl { flex-basis: 100%; }
  /* a phone: the name alone goes home, and the pages read as they do along the foot of the cover */
  .corners .part { display: none; }
  .corners .c:not(.tl) a, .corners .tr a, .corners .br a { flex-direction: row; gap: 4px; font-size: 12px; }
  .corners .c:not(.tl) i { display: none; }
  .corners .c:not(.tl) a b { font-size: 13px; }
}
.obj { position: relative; background: var(--paper); }
.obj::after {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; transform: translate(12px, 14px);
  background-image: radial-gradient(var(--shadows-shadow) 1px, transparent 1.4px); background-size: 5px 5px; opacity: 0.5;
}
.blot { position: absolute; z-index: -1; width: 420px; max-width: 70%; left: -60px; bottom: -40px; color: var(--shadows-blot); opacity: 0.45; pointer-events: none; }
.split > .main { position: relative; }

/* The page turn between the shelf and a volume. The shelf names the clicked card's record "rec" and its sleeve
   "sleeve"; a volume page names its own the same, so the browser carries both across and fades everything else.
   Browsers without cross-page transitions play it by hand (below). */
@view-transition { navigation: auto; }
.deck .rec-wrap { view-transition-name: rec; }
.vsleeve { view-transition-name: sleeve; }
/* one curve for everything: starts gently (the record is at rest, half out of its sleeve) and settles long */
::view-transition-group(rec), ::view-transition-group(sleeve), ::view-transition-old(root), ::view-transition-new(root) {
  animation-duration: .8s; animation-timing-function: cubic-bezier(.5, 0, .15, 1); }
html.vt-back::view-transition-group(sleeve) { z-index: 2; }   /* going back, the record slides in behind its sleeve */
html.vt-back::view-transition-group(rec) { z-index: 1; }
/* Behind the record, in screentone: paper-coloured dots, one per cell, grow over a page from a point outwards
   (toneDots below). Forward: once a record is chosen the shelf breaks up round its card (the card left standing),
   then the record comes out and turns over plain paper. Back: the volume breaks up from its record, the record and
   sleeve go home over paper, and the dots shrink away from the card to give the shelf back. */
.tone-veil { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 20; pointer-events: none; }
html .lp-card.chosen { z-index: 21; }   /* above the veil, over the hover and pull rules below */
@keyframes vt-hold { to { opacity: 1; } }
@keyframes vt-gone { 0%, 99% { opacity: 1; } 100% { opacity: 0; } }
html.vt-back::view-transition-new(root) { animation: vt-hold 1.75s both; }       /* keeps the turn open for the dots */
html.vt-back::view-transition-old(root) { z-index: 1; animation: vt-gone .62s both; }       /* under the dots once they cover it */
html.vt-back::view-transition-group(tone), html.vt-back::view-transition-new(tone) { animation: none; }
html.vt-back::view-transition-group(rec), html.vt-back::view-transition-group(sleeve) { animation-delay: .6s; }
@media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
/* Browsers that can't turn pages (Firefox) play the same turn by hand, in halves (the script below): the page that's
   left breaks into dots, the one arriving starts as nothing but paper (vt-hide) and the record and sleeve fly over it
   as stand-ins (.vt-stand) before the dots clear */
html.vt-hide body { visibility: hidden; }
html.vt-flying .deck .rec-wrap, html.vt-flying .vsleeve:not(.vt-stand) { visibility: hidden; }   /* the stand-ins are still on their way */
.vt-stand { position: fixed !important; margin: 0 !important; pointer-events: none; visibility: visible; transform-origin: 50% 50%; }

/* folio: page number and the next page, like the foot of a printed page */
.folio { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 3fr); gap: 12px 56px; align-items: baseline; margin-top: 72px; padding-block: 14px 28px; border-top: 2px solid var(--ink); font: 12px var(--font-mono); }
.folio .no { font-variant-numeric: tabular-nums; }

/* stamps, shared with the ball */
.stamp { display: inline-block; font: 400 12px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; padding: 0 9px; border: 2.5px solid currentColor; transform: rotate(-4deg); white-space: nowrap; }
.stamp.draft { font-size: 10px; color: var(--muted); transform: rotate(3deg); border-style: dashed; }
.stamp.live { color: var(--live-text); border-color: var(--live-edge); }

/* page title block */
.pt { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 22px; margin: 44px 0 28px; }
.pt h1 { margin: 0; font-size: clamp(52px, 9vw, 92px); line-height: 0.9; }
.pt p { margin: 0 0 6px; max-width: 46ch; }

/* ---------- 目次: the shelf ---------- */
.filters { display: grid; gap: 8px; font: 12px var(--font-mono); }
.filters .grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.filters .lbl { color: var(--muted); margin-right: 4px; }
.chip { font: 12px var(--font-mono); color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); padding: 1px 8px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.filters { margin: 0 0 8px; }
.gh { font-size: 22px; margin: 44px 0 18px; }
/* every volume as a record in its sleeve. Hover: the record slides half out. Click: all the way, then the page turns */
.lp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 40px 64px; padding-right: 48px; }
.lp-card { color: var(--ink); text-decoration: none; display: grid; gap: 12px; align-content: start; position: relative; transition: opacity .2s; }
.lp-card:hover, .lp-card:focus-visible, .lp-card.pulling { z-index: 2; }
.lp-card.dim { opacity: 0.2; }
.lp { position: relative; }
.lp .sl { line-height: 0; position: relative; z-index: 1; border: 2.5px solid var(--ink); }
.sleeve-art, .record { display: block; width: 100%; height: auto; }
.disc { position: absolute; z-index: 0; top: 3%; left: 3%; width: 94%; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.lp-card:hover .disc, .lp-card:focus-visible .disc { transform: translateX(38%) rotate(40deg); }
html:has(.lp-grid) { overflow-x: clip; }   /* a record pulled out of the last column runs off the page, not into a scrollbar */
.lp-card.pulling .disc { transform: translateX(116%) rotate(90deg); transition-duration: .34s; transition-timing-function: cubic-bezier(.2, .7, .3, 1); }
.lp-card .cap { display: grid; gap: 2px; }
.lp-card .cap span { font-size: 11px; }
.lp-card .livetxt { color: var(--live-text); }
.lp-card b { font: 400 16px/1.2 var(--font-display); }
.lp-card small { color: var(--muted); font-size: 13px; line-height: 1.4; }
.lp-card:hover b { text-decoration: underline; text-decoration-color: var(--live-red); text-decoration-thickness: 2px; text-underline-offset: 3px; }
@media (max-width: 520px) {
  .lp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 16px; padding-right: 0; }
  .lp-card:hover .disc { transform: translateX(14%) rotate(20deg); }
}
@media (prefers-reduced-motion: reduce) { .disc, .lp-card { transition: none; } }

/* ---------- a volume ---------- */
.vsleeve { max-width: 440px; margin-top: 28px; line-height: 0; border: 3px solid var(--ink); }
/* the turntable at the top of the rail: the record on the left, the tonearm pivoting from the top right */
.deck { position: relative; aspect-ratio: 6 / 5; margin: 0 0 4px; }
.deck .rec-wrap { position: absolute; left: 0; top: 0; width: 83.333%; }
.deck .arm { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
@media (max-width: 860px) {
  .vtop { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 10px; align-items: center; margin-top: 20px; }
  .vtop .vsleeve { margin: 0; border-width: 2px; }
}
.blurb { align-self: end; padding-bottom: 8px; }
.blurb h2 { font-size: 15px; font-family: var(--font-mono); font-weight: 500; margin: 0 0 8px; }
.blurb p { margin: 0 0 12px; max-width: 42ch; }
.blurb dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; font: 12px var(--font-mono); margin: 16px 0 0; }
.blurb dt { color: var(--muted); }
.blurb dd { margin: 0; }
.rail .blurb h2 { margin-top: 0; }
.rail .back { margin: 0; grid-template-columns: minmax(0, 1fr); gap: 22px; }

.tobira { text-align: center; margin: 96px auto 40px; max-width: 640px; }
.tobira .ep { font: 400 20px var(--font-display); letter-spacing: 0.1em; }
.tobira h2 { font-size: clamp(34px, 6vw, 58px); margin: 10px 0 18px; }
.tobira .stamps { display: flex; gap: 12px; justify-content: center; }

.page { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.panel { border: 3px solid var(--panels-border); display: grid; grid-template-rows: auto auto; min-width: 0; background: var(--paper); }
.panel svg { width: 100%; height: auto; display: block; }
.panel .txt { padding: 12px 16px 16px; border-top: 2px solid var(--panels-border); }
.panel .cap { display: inline-block; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; background: var(--panels-caption-box); color: var(--panels-caption-text); padding: 1px 8px; margin-bottom: 6px; }
.panel p { margin: 0; max-width: 62ch; }
.s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s6 { grid-column: span 6; }
@media (max-width: 640px) { .page > .panel { grid-column: 1 / -1; } }

.tsuzuku { display: flex; justify-content: flex-end; align-items: center; gap: 18px; margin: 18px 0 0; }
.tsuzuku .big { font: 400 30px var(--font-display); }
.next { margin: 40px 0 0; border: 3px solid var(--ink); padding: 16px 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: baseline; }
.next .lbl { font: 400 18px var(--font-display); }
.volnav { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: stretch; margin: 72px 0 0; }
.volnav a { display: grid; gap: 2px; padding: 12px 16px; border: 3px solid var(--ink); color: var(--ink); text-decoration: none; background: var(--paper); }
.volnav a span { font: 12px var(--font-mono); color: var(--muted); }
.volnav a b { font: 400 18px/1.2 var(--font-display); }
.volnav .vn-next { text-align: right; }
.volnav .vn-all { place-content: center; font-size: 18px; }
.volnav a:hover, .volnav a:focus-visible { background: var(--ink); color: var(--paper); }
.volnav a:hover span { color: var(--paper); }
@media (max-width: 640px) {   /* a phone: two slim buttons, the titles in the body face so even a long one stays short */
  .volnav { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 56px; } .volnav .vn-all { display: none; }
  .volnav a { padding: 8px 12px 9px; border-width: 2px; gap: 3px; align-content: start; }
  .volnav a span { font-size: 11px; }
  .volnav a b { font: 700 14px/1.3 var(--font-body); overflow-wrap: anywhere; }
}
.back { max-width: 880px; margin: 56px auto 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px; }
.back h3 { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 8px; }
.back ol, .back ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.back time { font: 12px var(--font-mono); color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font: 11px var(--font-mono); padding: 0 6px; border: 1.5px solid var(--ink); }

/* ---------- 作者紹介: the brief ---------- */
.brief + .brief { margin-top: 48px; }
.btabs { display: flex; gap: 28px; border-bottom: 2px solid var(--ink); margin-bottom: 18px; }
.btabs button { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); background: none; border: 0; padding: 0 0 8px; margin-bottom: -2px; border-bottom: 4px solid transparent; cursor: pointer; }
.btabs button:hover { color: var(--ink); }
.btabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--live-red); }
.kicker { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.brief .sum { font-size: clamp(18px, 1.8vw, 21px); line-height: 1.6; margin: 0; max-width: 60ch; }
.hl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hl a { display: grid; grid-template-columns: 7ch minmax(0, 1fr) auto; gap: 2px 14px; align-items: baseline; padding: 12px 14px; border: 2.5px solid var(--ink); color: var(--ink); text-decoration: none; background: var(--paper); }
.hl .no { font: 12px var(--font-mono); color: var(--muted); grid-row: span 2; }
.hl b { font: 400 20px/1.2 var(--font-display); }
.hl .meta { font: 12px var(--font-mono); color: var(--muted); white-space: nowrap; }
.hl .meta .live { color: var(--live-text); }
.hl .tag { grid-column: 2 / -1; font-size: 15px; line-height: 1.45; }
.hl a:hover, .hl a:focus-visible { background: var(--soft); }
.hl a:hover b { text-decoration: underline; text-decoration-color: var(--live-red); text-decoration-thickness: 2px; text-underline-offset: 3px; }
@media (max-width: 640px) { .hl a { grid-template-columns: minmax(0, 1fr); } .hl .no { grid-row: auto; } .hl .tag { grid-column: auto; } .hl .meta { white-space: normal; } }
.brief .years { font-size: 15px; max-width: 64ch; }
/* ---------- 作者紹介 ---------- */
.flap { display: grid; gap: 24px; }
.seal { width: 92px; height: 92px; border: 3px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font: 400 32px var(--font-display); transform: rotate(-8deg); }
.comment { border: 3px solid var(--ink); border-radius: 22px; padding: 14px 18px; font-size: 15px; position: relative; }
.comment::after { content: ""; position: absolute; left: 30px; top: -14px; width: 20px; height: 14px; background: var(--ink); clip-path: polygon(0 100%, 100% 100%, 20% 0); }
.flap h3 { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 8px; }
.years { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; line-height: 1.45; }
.years li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; }
.years time { font: 12px var(--font-mono); color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.contact { display: grid; gap: 6px; font: 13px var(--font-mono); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { font: 12px var(--font-mono); color: var(--ink); background: var(--paper); border: 2px solid var(--ink); padding: 3px 10px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover:not([disabled]) { background: var(--ink); color: var(--paper); }
.btn[disabled] { cursor: not-allowed; color: var(--muted); border-color: var(--tone); }
.select { user-select: all; }
.tabs { display: flex; gap: 0; border-bottom: 3px solid var(--cv-tabs); flex-wrap: wrap; }
.tabs button { font: 400 15px var(--font-display); color: var(--ink); background: var(--cv-paper); border: 3px solid var(--cv-tabs); border-bottom: 0; margin-right: -3px; padding: 6px 16px 4px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--cv-tabs); color: var(--cv-paper); }
.tabs .note { margin-left: auto; align-self: center; font: 11px var(--font-mono); color: var(--muted); padding-left: 12px; }
.cv { background: var(--cv-paper); border: 3px solid var(--cv-border); border-top: 0; padding: 24px clamp(16px, 4vw, 40px) 30px; }
.cv h1 { font-size: 30px; margin: 0 0 4px; }
.cv h2 { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.12em; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); }
.cv p { margin: 0 0 10px; max-width: 72ch; }
.cv ul { margin: 0 0 12px; padding-left: 18px; }
.cv li { margin-bottom: 4px; max-width: 72ch; font-size: 15px; }
.cv .head { font: 13px var(--font-mono); }
.cv .pdf { float: right; margin: 4px 0 8px 16px; }

/* ---------- 奥付 ---------- */
.seal-c { position: absolute; top: -26px; right: -22px; width: 92px; height: 92px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--paper);
  display: grid; place-content: center; text-align: center; transform: rotate(-10deg); z-index: 1; }
@media (max-width: 860px) { .seal-c { right: -6px; } }   /* the stamp stays on a phone's screen */
.seal-c b { font: 700 18px var(--font-body); }
.seal-c small { font: 10px var(--font-mono); color: var(--muted); letter-spacing: 0.1em; }
.okuzuke { max-width: 620px; margin: 30px 0 0; border: 3px double var(--ink); border-width: 6px; padding: 26px clamp(16px, 4vw, 34px); }
.okuzuke h2 { margin: 0 0 4px; font-size: 34px; }
.okuzuke .sub { font: 12px var(--font-mono); color: var(--muted); margin: 0 0 18px; }
.okuzuke dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 20px; margin: 0; border-top: 2px solid var(--ink); padding-top: 16px; }
.okuzuke dt { font: 700 15px var(--font-body); white-space: nowrap; }
.okuzuke dt small { display: block; font: 11px var(--font-mono); color: var(--muted); }
.okuzuke dd { margin: 0; font-size: 15px; min-width: 0; }
.okuzuke code { font: 13px var(--font-mono); }
.pipe { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 12px var(--font-mono); margin-top: 4px; }
.pipe span { border: 2px solid var(--ink); padding: 1px 8px; }
.pipe i { font-style: normal; color: var(--muted); }
.upd-big { display: grid; gap: 2px; margin: 0 0 20px; }
.upd-big span { font-size: 12px; }
.upd-big b { font: 400 clamp(30px, 4vw, 40px)/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 520px) { .upd-big b { font-size: 8vw; } }   /* the date on one line, even on a small phone */
.folio .upd { color: var(--muted); margin-left: 14px; white-space: nowrap; }
@media (max-width: 640px) { .folio { grid-template-columns: minmax(0, 1fr); } .folio .upd { margin-left: 8px; } }
@media (max-width: 860px) { .flap .seal { display: none; } }   /* phones: the brief reaches the summary sooner */
.pages { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 14px; }
</style>
<!--TURN-->
<link rel="expect" href="#end" blocking="render">
<script>
/* the screentone: a canvas over the page; each dot starts when the front from (ox, oy) reaches it and fills its cell a
   band later (grow), or starts full and shrinks to nothing the same way (!grow) */
const toneVeil = () => {
  /* sharp on a phone, but a big screen at 2x is five million pixels to repaint every frame of the turn: keep it to
     about 2.6 million (a laptop's dots come out a touch soft, which you can't see while they move) */
  const d = Math.max(1, Math.min(devicePixelRatio || 1, 2, Math.sqrt(2.6e6 / (innerWidth * innerHeight)))), cv = document.createElement("canvas");
  cv.className = "tone-veil"; cv.setAttribute("aria-hidden", "true"); cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d);
  document.body.append(cv); return cv;
};
const toneDots = (cv, ox, oy, ms, grow = true) => new Promise(done => {
  const W = innerWidth, H = innerHeight, g = cv.getContext("2d"), d = cv.width / W;
  g.setTransform(d, 0, 0, d, 0, 0); g.fillStyle = getComputedStyle(document.body).backgroundColor;
  const C = 11, R = C * 0.72, band = Math.max(W, H) * 0.32;
  /* the cells nearest the start first, so each frame touches only the ring the front has just passed through:
     a dot ahead of it hasn't changed, and one a band behind is finished */
  const cx = [], cy = [], cd = [];
  for (let y = C / 2; y < H + C; y += C) for (let x = C / 2; x < W + C; x += C) { cx.push(x); cy.push(y); cd.push(Math.hypot(x - ox, y - oy)); }
  const ord = Uint32Array.from(cd.keys()).sort((i, j) => cd[i] - cd[j]), n = ord.length;
  const far = cd[ord[n - 1]] + band;
  if (!grow) { g.beginPath(); for (let i = 0; i < n; i++) { g.moveTo(cx[i] + R, cy[i]); g.arc(cx[i], cy[i], R, 0, 6.2832); } g.fill(); }
  const t0 = performance.now(), ease = t => t < .5 ? 2 * t * t : 1 - (2 - 2 * t) ** 2 / 2;
  let lo = 0, prev = -Infinity;
  const frame = now => {
    const t = Math.min(1, (now - t0) / ms), f = ease(t) * far;
    while (lo < n && cd[ord[lo]] < prev - band) lo++;           // finished on an earlier frame
    let hi = lo; while (hi < n && cd[ord[hi]] <= f) hi++;          // beyond hi the front hasn't arrived
    // growing dots only get bigger, so they're drawn over what's there; shrinking ones clear their cell first
    if (!grow) for (let j = lo; j < hi; j++) { const i = ord[j]; g.clearRect(cx[i] - C / 2, cy[i] - C / 2, C, C); }
    g.beginPath();
    for (let j = lo; j < hi; j++) {
      const i = ord[j], k = Math.min(1, (f - cd[i]) / band), r = R * (grow ? k : 1 - k);
      if (r > 0.2) { g.moveTo(cx[i] + r, cy[i]); g.arc(cx[i], cy[i], r, 0, 6.2832); }
    }
    g.fill(); prev = f;
    t < 1 ? requestAnimationFrame(frame) : done();
  };
  requestAnimationFrame(frame);
});
/* leaving a volume: remember where its record is, so going back the volume breaks up from there, and which volume
   this was, for browsers that can't say where a page was opened from (Safari has no navigation.activation) */
addEventListener("pageswap", e => {
  /* read from the foot of the page (the 目次 links there), the sleeve, and on a phone the record too, are far above the
     screen and would turn up halfway through the flight: start them just above the top edge instead. A transform, so
     nothing else moves; undone on pageshow if Back brings this page out of the cache */
  if (e.viewTransition) document.querySelectorAll(".deck .rec-wrap, .vsleeve").forEach(el => {
    const b = el.getBoundingClientRect(); if (b.bottom < 0) el.style.transform = `translateY(${(-b.bottom - 8).toFixed(0)}px)`; });
  const r = document.querySelector(".deck .rec-wrap")?.getBoundingClientRect(), v = location.pathname.match(/vol-([\w-]+)\.html$/);
  try { if (r) sessionStorage.vtrec = JSON.stringify([r.left + r.width / 2, r.top + r.height / 2]);
        if (v) sessionStorage.vtvol = JSON.stringify([v[1], Date.now()]); } catch (_) {}
});
/* a volume fetches the shelf once it has loaded and the browser is idle, or sooner if a link to it is pointed at. Back
   finds the shelf in the page cache, but a link (目次, all the projects) loads it afresh, and it is a big page: a turn
   kept waiting on the network for more than a few seconds is dropped, and the shelf just appears without it */
if (/vol-[\w-]+\.html$/.test(location.pathname)) {
  let got = false;
  const get = () => { if (got) return; got = true;
    const l = document.createElement("link"); l.rel = "prefetch"; l.href = "contents.html"; document.head.append(l); };
  ["pointerover", "focusin", "touchstart"].forEach(ev => document.addEventListener(ev, e => {
    if (e.target.closest?.('a[href="contents.html"]')) get(); }, { passive: true }));
  addEventListener("load", () => (window.requestIdleCallback || setTimeout)(get, { timeout: 2000 }));
}
addEventListener("pageshow", () => document.querySelectorAll(".deck .rec-wrap, .vsleeve").forEach(el => el.style.transform = ""));
/* leaving the shelf by Back or Forward: a card's click names its record and sleeve, but the browser's buttons click
   nothing. Chrome says where they lead; Safari doesn't, and the likeliest is the volume this shelf was last brought
   back from (Forward again), so that card is named. If it leads elsewhere, a head page's wave keeps the stray record
   under the old page, where it was (src/turn.html) */
let lastVol = null;
addEventListener("pageswap", e => {
  if (!e.viewTransition || [...document.querySelectorAll("[data-vt] .disc")].some(d => d.style.viewTransitionName)) return;
  let to = e.activation?.entry?.url;
  if (!to) try { to = JSON.parse(sessionStorage.vtfrom || "null")?.to; } catch (_) {}   // a click on a link (src/turn.html)
  const vid = to ? (to.match(/vol-([\w-]+)\.html/) || [])[1] : lastVol;
  const card = vid && document.querySelector(`[data-vt="${vid}"]`);
  if (!card) return;
  card.querySelector(".disc").style.viewTransitionName = "rec";
  card.querySelector(".sl").style.viewTransitionName = "sleeve";
  const r = card.querySelector(".lp").getBoundingClientRect();
  if (!to) try { sessionStorage.vtstray = JSON.stringify([r.left + r.width / 2, r.top + r.height / 2]); } catch (_) {}
});
/* back on the shelf from a volume: that volume's record and sleeve go home to their card */
addEventListener("pagereveal", e => {
  document.querySelectorAll("[data-vt] .disc, [data-vt] .sl").forEach(el => el.style.viewTransitionName = "");
  let left = null; try { left = JSON.parse(sessionStorage.vtvol || "null"); sessionStorage.removeItem("vtvol"); } catch (_) {}
  const from = window.navigation?.activation?.from?.url;   // null in browsers without it, and in some that have it
  const vid = !e.viewTransition ? null
    : from ? (from.match(/vol-([\w-]+)\.html/) || [])[1]                     // the browser says where we came from
    : left && Date.now() - left[1] < 8000 ? left[0] : null;                   // else the note the volume left, if it's fresh
  const card = vid && document.querySelector(`[data-vt="${vid}"]`);
  if (!card) return;
  lastVol = vid;
  /* by the 目次 link (not Back) the shelf opens at its top, so most cards are off screen: bring this one to the middle
     first, or the record and sleeve fly home off the bottom of the screen */
  let r = card.querySelector(".lp").getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) {
    scrollTo({ top: scrollY + r.top + r.height / 2 - innerHeight / 2, behavior: "instant" });
    r = card.querySelector(".lp").getBoundingClientRect();
  }
  let o = [innerWidth / 2, innerHeight / 2]; try { o = JSON.parse(sessionStorage.vtrec || "null") || o; sessionStorage.removeItem("vtrec"); } catch (_) {}
  const cv = toneVeil(); cv.style.viewTransitionName = "tone";    // empty at first paint, so the turn starts on the volume
  toneDots(cv, o[0], o[1], 620).then(() => new Promise(w => setTimeout(w, 420)))
    .then(() => toneDots(cv, r.left + r.width / 2, r.top + r.height / 2, 700, false));
  e.viewTransition.finished.finally(() => cv.remove());
  card.querySelector(".disc").style.viewTransitionName = "rec";
  card.querySelector(".sl").style.viewTransitionName = "sleeve";
  document.documentElement.classList.add("vt-back");
  e.viewTransition.finished.finally(() => { document.documentElement.classList.remove("vt-back"); card.querySelectorAll(".disc, .sl").forEach(el => el.style.viewTransitionName = ""); });
});

/* The same turns where the browser can't turn pages (Firefox), played by the two pages in halves that meet on plain
   paper. Forward: the shelf breaks up and pulls the record out as above, then leaves a note of where the record and
   sleeve were (vtfly); the volume starts as paper, they fly from there to their places on it, and the dots clear
   from the record. Back (the 目次 link, or the browser's button): the volume breaks up from its record if it can
   (a link; Back gives no warning) and leaves a note of where they were (vtland); the shelf starts as paper, they fly
   home to their card, and the dots clear from it. */
const vtHand = !("CSSViewTransitionRule" in window) && !window.vtFramed && !matchMedia("(prefers-reduced-motion: reduce)").matches;
const vtVol = p => (String(p || "").match(/vol-([\w-]+)\.html/) || [])[1];
const vtTake = k => { try { const n = JSON.parse(sessionStorage.getItem(k) || "null"); sessionStorage.removeItem(k); return n && Date.now() - n.t < 8000 ? n : null; } catch (_) { return null; } };
const vtBox = el => { const b = el.getBoundingClientRect(); return [b.left, b.top, b.width, b.height]; };
/* where a record or sleeve is for the next page: one far above or below the screen (read from the foot of a volume)
   starts just off its edge instead, as in the browser's turn */
const vtOnScreen = el => { const [x, y, w, h] = vtBox(el); return [x, y + h < 0 ? -h - 8 : y > innerHeight ? innerHeight + 8 : y, w, h]; };
/* a stand-in for el, fixed over everything where el is, flown there from `from` (a box), turning `turn` degrees */
const vtStand = (el, z, from, ms = 800, turn = 0) => {
  const to = vtBox(el), c = el.cloneNode(true), cs = getComputedStyle(el);
  c.classList.add("vt-stand"); c.style.cssText += `;left:${to[0]}px;top:${to[1]}px;width:${to[2]}px;height:${to[3]}px;z-index:${z};`
    + `border-width:${cs.borderTopWidth};transform:none;transition:none;view-transition-name:none`;
  document.body.append(c);
  if (!from) return Promise.resolve(c);
  const dx = from[0] + from[2] / 2 - to[0] - to[2] / 2, dy = from[1] + from[3] / 2 - to[1] - to[3] / 2, k = from[2] / Math.max(1, to[2]);
  return c.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${k}) rotate(${turn}deg)` }, { transform: "none" }],
    { duration: ms, easing: "cubic-bezier(.5, 0, .15, 1)", fill: "both" }).finished.then(() => c);
};
/* a veil already full of dots: all paper */
const vtFullVeil = () => { const cv = toneVeil(), g = cv.getContext("2d");
  g.fillStyle = getComputedStyle(document.body).backgroundColor; g.fillRect(0, 0, cv.width, cv.height); return cv; };
const vtWait = ms => new Promise(w => setTimeout(w, ms));
const vtReady = () => new Promise(w => document.readyState === "loading" ? addEventListener("DOMContentLoaded", w, { once: true }) : w())
  .then(() => Promise.race([document.fonts ? document.fonts.ready : null, vtWait(500)]));
if (vtHand) {
  const root = document.documentElement, onVol = vtVol(location.pathname), onShelf = /(^|\/)contents\.html$/.test(location.pathname);
  const arrive = cached => {
    const from = window.vtFrom;                        // where this page was opened from (src/turn.html)
    // onto a volume from the shelf, or from the volume either side (build.py's volnav)
    const fly = onVol && (/(^|\/)contents\.html$/.test(new URL(from || "x:", location.href).pathname) || vtVol(from)) && vtTake("vtfly");
    /* back on the shelf: from a volume, by the note it left. Firefox can bring a shelf back from its page cache before
       the note that volume left on its way out can be read, so a shelf brought back with a card still chosen (the
       one it was left by) knows the volume from that, and where its record and sleeve were from what the volume kept
       noting while it was open (vtseen) */
    let land = null;
    if (onShelf) {
      const chosen = cached && document.querySelector(".lp-card.chosen"), vid = vtVol(from) || (!from && chosen ? chosen.dataset.vt : null);
      land = vid && vtTake("vtland");
      if (vid && (!land || land.vol !== vid)) try { const v = JSON.parse(sessionStorage.vtseen || "null"); land = v && v.vol === vid ? v : null; } catch (_) {}
      if (land && land.vol !== vid) land = null;
    }
    const n = fly && fly.vol === onVol ? fly : land;
    if (!n) return;
    root.classList.add("vt-hide");
    const safe = setTimeout(() => root.classList.remove("vt-hide"), 4000);   // whatever happens, the page shows
    window.vtLanded = vtReady().then(async () => {
      let rec, sl, home;
      if (onVol) { rec = document.querySelector(".deck .rec-wrap"); sl = document.querySelector(".vsleeve"); }
      else {
        const card = document.querySelector(`[data-vt="${n.vol}"]`);
        if (!card) return;
        document.querySelectorAll(".pulling, .chosen").forEach(c => c.classList.remove("pulling", "chosen"));
        document.querySelectorAll(".tone-veil").forEach(v => v.remove());
        rec = card.querySelector(".disc"); sl = card.querySelector(".sl");
        rec.style.transition = "none"; rec.offsetWidth; rec.style.transition = "";   // straight back in its sleeve
        home = card.querySelector(".lp");
        let r = home.getBoundingClientRect();                                         // and the card on the screen
        if (r.top < 0 || r.bottom > innerHeight) scrollTo({ top: scrollY + r.top + r.height / 2 - innerHeight / 2, behavior: "instant" });
      }
      const cv = vtFullVeil();
      cv.style.visibility = "visible";
      // forward the record lands on top of its sleeve, coming out of its quarter turn; back it goes in behind
      const flights = [vtStand(sl, onVol ? 30 : 31, n.sl), vtStand(rec, onVol ? 31 : 30, n.rec, 800, onVol ? n.turn ?? 90 : 0)];
      root.classList.remove("vt-hide"); clearTimeout(safe);
      const at = el => { const b = el.getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2]; };
      let stands;
      if (onVol) {                                     // the volume forms round the record as it lands
        root.classList.add("vt-flying");
        await vtWait(350); const o = at(rec);
        const dots = toneDots(cv, o[0], o[1], 700, false);
        stands = await Promise.all(flights); root.classList.remove("vt-flying"); await dots;
      } else {                                         // home first, then the shelf comes back from the card
        stands = await Promise.all(flights); await vtWait(120);
        const o = at(home); await toneDots(cv, o[0], o[1], 700, false);
      }
      stands.forEach(c => c.remove()); cv.remove();
    }).finally(() => { clearTimeout(safe); root.classList.remove("vt-hide", "vt-flying"); });
  };
  arrive(false);
  addEventListener("pageshow", e => {
    if (!e.persisted) return;
    if (onVol) document.querySelectorAll(".vt-stand, .tone-veil").forEach(el => el.remove());   // as it was left for the shelf
    arrive(true);
  });
  /* a volume notes where its record and sleeve are, in case it's left for the shelf: on the way out (vtland), and,
     for a browser that may not read that in time, whenever it has been scrolled (vtseen) */
  if (onVol) {
    const boxes = () => ({ vol: onVol, rec: vtOnScreen(document.querySelector(".deck .rec-wrap")), sl: vtOnScreen(document.querySelector(".vsleeve")), t: Date.now() });
    const seen = () => { try { sessionStorage.vtseen = JSON.stringify(boxes()); } catch (_) {} };
    let st = 0;
    addEventListener("scroll", () => { clearTimeout(st); st = setTimeout(seen, 150); }, { passive: true });
    addEventListener("resize", () => { clearTimeout(st); st = setTimeout(seen, 150); });
    addEventListener("load", () => setTimeout(seen, 1200));       // once the record has landed
    addEventListener("pageshow", e => { if (e.persisted) seen(); });
    addEventListener("pagehide", () => { try { sessionStorage.vtland = JSON.stringify(boxes()); } catch (_) {} });
  }
  /* leaving a volume by a link for the shelf, or for another volume: it breaks up first, the record and sleeve
     standing; for the shelf from the record, as the browser's turn does, and for a volume from where you clicked. The
     next volume's record and sleeve then fly in from where these were, as the browser carries them across */
  if (onVol) document.addEventListener("click", e => {
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a || a.target) return;
    const u = new URL(a.href), toVol = vtVol(u.pathname);
    if (u.origin !== location.origin || !(/(^|\/)contents\.html$/.test(u.pathname) || (toVol && toVol !== onVol))) return;
    e.preventDefault();
    const rec = document.querySelector(".deck .rec-wrap"), sl = document.querySelector(".vsleeve");
    const boxes = { rec: vtOnScreen(rec), sl: vtOnScreen(sl) };
    Promise.all([vtStand(sl, 30), vtStand(rec, 31)]).then(stands => {
      stands.forEach(c => { const b = c === stands[0] ? boxes.sl : boxes.rec; c.style.left = b[0] + "px"; c.style.top = b[1] + "px"; });
      const o = toVol ? [e.clientX, e.clientY] : [boxes.rec[0] + boxes.rec[2] / 2, boxes.rec[1] + boxes.rec[3] / 2];
      return toneDots(toneVeil(), o[0], o[1], 620);
    }).then(() => vtWait(120)).then(() => {
      try { sessionStorage.vtfrom = JSON.stringify({ from: location.href, to: a.href, t: Date.now() });
            if (toVol) sessionStorage.vtfly = JSON.stringify({ vol: toVol, ...boxes, turn: 0, t: Date.now() }); } catch (_) {}
      location.href = a.href;
    });
  });
}
</script>
