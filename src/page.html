<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: the site is a manga series. The cover (the ball) is home; every project is a volume with its own
   cover and spine; the trade dress (logo, volume number, obi, folio) is the same on all of them and only the
   art changes. Inner pages share one running head and one folio. Ink on paper; red only for what is live. */
:root {
  --paper: #ffffff;
  --ink: #111111;
  --tone: #8a8a8a;
  --soft: #ececec;
  --muted: #555555;
  --spot: #d7262e;
  --on-spot: #ffffff;
  --font-display: "Dela Gothic One", "Arial Black", Impact, system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --spine-h: 280px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d0d0d; --ink: #f1f1f1; --tone: #6d6d6d; --soft: #222222; --muted: #a9a9a9; --spot: #ff4b52; --on-spot: #0d0d0d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d0d0d; --ink: #f1f1f1; --tone: #6d6d6d; --soft: #222222; --muted: #a9a9a9; --spot: #ff4b52; --on-spot: #0d0d0d;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.7 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
a { color: var(--ink); text-decoration-thickness: 2px; text-decoration-color: var(--spot); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--spot); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; }
/* 7-3: every page is a main column (70%) and a rail (30%) that holds what supports it */
.split { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 3fr); gap: 0 56px; align-items: start; margin-top: 32px; }
.split > .rail { position: sticky; top: 24px; display: grid; gap: 22px; align-content: start; max-height: calc(100vh - 48px); overflow: auto; padding-bottom: 8px; }
.split > .rail .pt { margin: 0; display: grid; gap: 10px; }
.split > .rail .pt h1 { font-size: clamp(48px, 5.4vw, 76px); }
.split > .rail .pt p { margin: 0; font-size: 15px; }
.split > .main { padding-top: 6px; }
@media (max-width: 860px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .split > .rail { position: static; max-height: none; order: -1; margin-bottom: 18px; }
  .split.main-first > .rail { order: 0; margin: 40px 0 0; }
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; line-height: 1.1; }
.mono { font-family: var(--font-mono); }
.jp { font-family: var(--font-body); font-weight: 700; }
.muted { color: var(--muted); }

/* Shapes, as on the cover. Circle: a person or something live. Square: something you read. Triangle: direction.
   Organic: art. Depth: every object casts the same flat screentone shadow, and nothing else does. */
body { position: relative; min-height: 100vh; }
.wrap { padding-block: 92px 64px; }
.corners .c { position: absolute; z-index: 5;   /* on the page, not the screen: the bottom corners wait at the end */ display: flex; gap: 2px; background: var(--paper); padding: 5px 9px; font: 13px var(--font-mono); }
.corners a { display: flex; gap: 8px; align-items: center; color: var(--ink); text-decoration: none; }
.corners a b { font: 700 14px var(--font-body); }
.corners i { display: block; flex: none; width: 11px; height: 11px; background: var(--ink); }
.corners a:hover i, .corners a[aria-current] i { background: var(--spot); }
.corners a[aria-current] { text-decoration: underline; text-decoration-color: var(--spot); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.corners .tl { top: calc(env(safe-area-inset-top, 0px) + 18px); left: calc(env(safe-area-inset-left, 0px) + 22px); flex-direction: column; }
.corners .tl i { clip-path: polygon(0 0, 100% 0, 0 100%); }
.corners .home { font: 400 15px var(--font-display); letter-spacing: 0.02em; }
.corners .part { font: 12px var(--font-mono); color: var(--muted); padding-left: 19px; }
.corners .tr { top: calc(env(safe-area-inset-top, 0px) + 18px); right: calc(env(safe-area-inset-right, 0px) + 22px); }
.corners .tr a, .corners .br a { flex-direction: row-reverse; }
.corners .tr i { clip-path: polygon(0 0, 100% 0, 100% 100%); }
.corners .bl { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: calc(env(safe-area-inset-left, 0px) + 22px); }
.corners .bl i { clip-path: polygon(0 0, 0 100%, 100% 100%); }
.corners .br { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 22px); }
.corners .br i { clip-path: polygon(100% 0, 100% 100%, 0 100%); }
@media (max-width: 860px) {
  .wrap { padding-top: 20px; }
  .corners { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 2px solid var(--ink); }
  .corners .c { position: static; padding: 0; background: none; }
  .corners .tl { flex-basis: 100%; }
}
.obj { position: relative; background: var(--paper); }
.obj::after {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; transform: translate(12px, 14px);
  background-image: radial-gradient(var(--ink) 1px, transparent 1.4px); background-size: 5px 5px; opacity: 0.5;
}
.blot { position: absolute; z-index: -1; width: 420px; max-width: 70%; left: -60px; bottom: -40px; color: var(--ink); opacity: 0.45; pointer-events: none; }
.split > .main { position: relative; }

/* folio: page number and the next page, like the foot of a printed page */
.folio { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 3fr); gap: 12px 56px; align-items: baseline; margin-top: 72px; padding-block: 14px 28px; border-top: 2px solid var(--ink); font: 12px var(--font-mono); }
.folio .no { font-variant-numeric: tabular-nums; }

/* stamps, shared with the ball */
.stamp { display: inline-block; font: 400 12px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; padding: 0 9px; border: 2.5px solid currentColor; transform: rotate(-4deg); white-space: nowrap; }
.stamp.draft { font-size: 10px; color: var(--muted); transform: rotate(3deg); border-style: dashed; }
.stamp.live { color: var(--spot); }

/* page title block */
.pt { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 22px; margin: 44px 0 28px; }
.pt h1 { margin: 0; font-size: clamp(52px, 9vw, 92px); line-height: 0.9; }
.pt p { margin: 0 0 6px; max-width: 46ch; }

/* ---------- 目次: the shelf ---------- */
.filters { display: grid; gap: 8px; font: 12px var(--font-mono); }
.filters .grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.filters .lbl { color: var(--muted); margin-right: 4px; }
.chip { font: 12px var(--font-mono); color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); padding: 1px 8px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.shelfname { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
section + section .shelfname { margin-top: 40px; }
.shelfname h2 { margin: 0; font-size: 22px; }
.shelfname span { font: 12px var(--font-mono); color: var(--muted); }
.shelf {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 3px; row-gap: 22px;
  /* a board under every row of books */
  background: repeating-linear-gradient(to bottom, transparent 0 var(--spine-h), var(--ink) var(--spine-h) calc(var(--spine-h) + 6px), transparent calc(var(--spine-h) + 6px) calc(var(--spine-h) + 22px));
  padding-bottom: 0;
}
.slot { height: var(--spine-h); display: flex; align-items: flex-end; position: relative; }
.slot::after {
  content: ""; position: absolute; z-index: -1; left: 9px; bottom: 0; width: 34px; height: var(--sh); pointer-events: none; opacity: 0; transition: opacity 0.18s;
  background-image: radial-gradient(var(--ink) 1px, transparent 1.4px); background-size: 5px 5px;
}
.slot.big::after { width: 52px; }
.slot:has(.spine[aria-expanded="true"])::after, .slot:has(.spine:hover)::after, .slot:has(.spine:focus-visible)::after { opacity: 0.5; }
.spine {
  --w: 34px;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto; justify-items: center;
  width: var(--w); height: var(--h, 250px); padding: 0; margin: 0;
  color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-bottom: 0;
  font: inherit; text-decoration: none; cursor: pointer; overflow: hidden;
  transition: transform 0.18s ease-out, opacity 0.2s;
}
.spine.big { --w: 52px; }
.spine:hover, .spine:focus-visible, .spine[aria-expanded="true"] { transform: translateY(-12px); }
.spine.dim { opacity: 0.18; }
@media (prefers-reduced-motion: reduce) { .spine { transition: none; } }
.spine .ser { font: 500 8px var(--font-mono); letter-spacing: 0.1em; padding-top: 5px; }
.spine .vol { font: 400 13px var(--font-display); font-variant-numeric: tabular-nums; padding: 1px 0 4px; }
.spine.big .vol { font-size: 17px; }
.spine .ttl { writing-mode: vertical-rl; font: 400 13px/1 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 6px 0; min-height: 0; max-height: 100%; }
.spine.big .ttl { font-size: 17px; }
.spine .art { width: 100%; height: 54px; display: block; border-top: 2px solid var(--ink); }
.spine .obi { width: 100%; height: 30px; display: grid; place-items: center; background: var(--ink); color: var(--paper); }
.spine .obi.live { background: var(--spot); color: var(--on-spot); }
.spine .obi svg { width: 12px; height: 12px; }
.sleeve { aspect-ratio: 1; border: 2.5px solid var(--ink); }
.pull { height: 100%; overflow: auto; padding: 16px 18px 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; }
.pull .side { grid-row: 1; font: 12px var(--font-mono); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-items: start; }
.pull .side .x { margin-left: auto; order: 9; }
.pull h3 { margin: 6px 0 2px; font-size: 26px; }
.pull .tag { margin: 0 0 8px; }
.pull ul { margin: 6px 0 0; padding-left: 18px; }
.pull li { margin-bottom: 4px; max-width: 70ch; }
.pull .meta { font: 12px var(--font-mono); color: var(--muted); }
.pull .x { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); font: 400 14px var(--font-display); cursor: pointer; }

/* ---------- a volume ---------- */
.book { display: grid; grid-template-columns: auto minmax(0, 460px); gap: 0 28px; align-items: start; justify-content: center; margin-top: 36px; }
.book .spine { cursor: default; height: auto; }
.book > .obj { align-self: stretch; display: flex; }
.book > .obj > .spine { height: auto; }
.book .spine:hover { transform: none; }
.cover { width: 100%; aspect-ratio: 128 / 182; max-width: 100%; border: 3px solid var(--ink); display: block; background: var(--paper); }
.blurb { align-self: end; padding-bottom: 8px; }
.blurb h2 { font-size: 15px; font-family: var(--font-mono); font-weight: 500; margin: 0 0 8px; }
.blurb p { margin: 0 0 12px; max-width: 42ch; }
.blurb dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; font: 12px var(--font-mono); margin: 16px 0 0; }
.blurb dt { color: var(--muted); }
.blurb dd { margin: 0; }
@media (max-width: 760px) { .book { grid-template-columns: minmax(0, 1fr); gap: 20px; } .book > .obj:first-child { display: none; } }
.rail .blurb h2 { margin-top: 0; }
.rail .back { margin: 0; grid-template-columns: minmax(0, 1fr); gap: 22px; }

.tobira { text-align: center; margin: 96px auto 40px; max-width: 640px; }
.tobira .ep { font: 400 20px var(--font-display); letter-spacing: 0.1em; }
.tobira h2 { font-size: clamp(34px, 6vw, 58px); margin: 10px 0 18px; }
.tobira .stamps { display: flex; gap: 12px; justify-content: center; }

.page { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.panel { border: 3px solid var(--ink); display: grid; grid-template-rows: auto auto; min-width: 0; background: var(--paper); }
.panel svg { width: 100%; height: auto; display: block; }
.panel .txt { padding: 12px 16px 16px; border-top: 2px solid var(--ink); }
.panel .cap { display: inline-block; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; background: var(--ink); color: var(--paper); padding: 1px 8px; margin-bottom: 6px; }
.panel p { margin: 0; max-width: 62ch; }
.s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s6 { grid-column: span 6; }
@media (max-width: 640px) { .page > .panel { grid-column: 1 / -1; } }

.tsuzuku { display: flex; justify-content: flex-end; align-items: center; gap: 18px; margin: 18px 0 0; }
.tsuzuku .big { font: 400 30px var(--font-display); }
.next { margin: 40px 0 0; border: 3px solid var(--ink); padding: 16px 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: baseline; }
.next .lbl { font: 400 18px var(--font-display); }
.back { max-width: 880px; margin: 56px auto 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px; }
.back h3 { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 8px; }
.back ol, .back ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.back time { font: 12px var(--font-mono); color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font: 11px var(--font-mono); padding: 0 6px; border: 1.5px solid var(--ink); }

/* ---------- 作者紹介 ---------- */
.flap { display: grid; gap: 24px; }
.seal { width: 92px; height: 92px; border: 3px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font: 400 32px var(--font-display); transform: rotate(-8deg); }
.comment { border: 3px solid var(--ink); border-radius: 22px; padding: 14px 18px; font-size: 15px; position: relative; }
.comment::after { content: ""; position: absolute; left: 30px; top: -14px; width: 20px; height: 14px; background: var(--ink); clip-path: polygon(0 100%, 100% 100%, 20% 0); }
.flap h3 { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 8px; }
.years { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; line-height: 1.45; }
.years li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; }
.years time { font: 12px var(--font-mono); color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.contact { display: grid; gap: 6px; font: 13px var(--font-mono); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { font: 12px var(--font-mono); color: var(--ink); background: var(--paper); border: 2px solid var(--ink); padding: 3px 10px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover:not([disabled]) { background: var(--ink); color: var(--paper); }
.btn[disabled] { cursor: not-allowed; color: var(--muted); border-color: var(--tone); }
.select { user-select: all; }
.tabs { display: flex; gap: 0; border-bottom: 3px solid var(--ink); flex-wrap: wrap; }
.tabs button { font: 400 15px var(--font-display); color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-bottom: 0; margin-right: -3px; padding: 6px 16px 4px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tabs .note { margin-left: auto; align-self: center; font: 11px var(--font-mono); color: var(--muted); padding-left: 12px; }
.cv { border: 3px solid var(--ink); border-top: 0; padding: 24px clamp(16px, 4vw, 40px) 30px; }
.cv h1 { font-size: 30px; margin: 0 0 4px; }
.cv h2 { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.12em; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); }
.cv p { margin: 0 0 10px; max-width: 72ch; }
.cv ul { margin: 0 0 12px; padding-left: 18px; }
.cv li { margin-bottom: 4px; max-width: 72ch; font-size: 15px; }
.cv .head { font: 13px var(--font-mono); }

/* ---------- 奥付 ---------- */
.seal-c { position: absolute; top: -26px; right: -22px; width: 92px; height: 92px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--paper);
  display: grid; place-content: center; text-align: center; transform: rotate(-10deg); z-index: 1; }
.seal-c b { font: 700 18px var(--font-body); }
.seal-c small { font: 10px var(--font-mono); color: var(--muted); letter-spacing: 0.1em; }
.okuzuke { max-width: 620px; margin: 30px 0 0; border: 3px double var(--ink); border-width: 6px; padding: 26px clamp(16px, 4vw, 34px); }
.okuzuke h2 { margin: 0 0 4px; font-size: 34px; }
.okuzuke .sub { font: 12px var(--font-mono); color: var(--muted); margin: 0 0 18px; }
.okuzuke dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 20px; margin: 0; border-top: 2px solid var(--ink); padding-top: 16px; }
.okuzuke dt { font: 700 15px var(--font-body); white-space: nowrap; }
.okuzuke dt small { display: block; font: 11px var(--font-mono); color: var(--muted); }
.okuzuke dd { margin: 0; font-size: 15px; min-width: 0; }
.okuzuke code { font: 13px var(--font-mono); }
.pipe { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 12px var(--font-mono); margin-top: 4px; }
.pipe span { border: 2px solid var(--ink); padding: 1px 8px; }
.pipe i { font-style: normal; color: var(--muted); }
.pages { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 14px; }
</style>
</head>
<body>
<nav class="corners" aria-label="Volume">{{nav}}</nav>
<div class="wrap">
<main>
{{main}}
</main>
<footer class="folio"><span class="no">— {{folio}} —</span>{{next}}</footer>
</div>
{{script}}
</body>
</html>
