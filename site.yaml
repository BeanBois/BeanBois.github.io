# site.yaml: the one file to edit for the website's words, colours and music.
#
# Facts about projects (what each one is, when, its bullets and stack) live in the bank, in the portfolio repo.
# This file is how the site presents them. GUIDE.md explains every section and how to see a change.
#
#   python3 build.py --watch      builds, serves on http://127.0.0.1:8765, rebuilds when you save
#
# YAML tips: keep the two-space indents; text with a colon or # in it goes in "double quotes".

# ---------------------------------------------------------------------------------------------------------------
# You
you:
  name: TEOH KAI SHUN                                   # on the cover, in every page's top-left corner and on volume covers
  role: ML Engineer · AI infra at Tencent · Malaysia    # under your name on the cover
  role_short: ML Engineer · Tencent · Malaysia          # under your name on the author page
  one_liner: "Engineer in Malaysia. Day job: keeping GPUs busy at Tencent. Nights: too many side projects. This is all of them."
                                                        # your author's comment; it also opens the cover's intro

# ---------------------------------------------------------------------------------------------------------------
# The site has four parts, each for a different reader:
#   the cover   (index.html)    the hook: the record, and a back-of-the-book blurb that sends you on
#   the brief   (author.html)   thirty seconds: who, the highlights, the years, contact, the CV
#   the projects (contents.html + a volume each)   in depth: every project as a record in its sleeve
#   the colophon (colophon.html) the footnote: when the site was last updated and how it's made
nav:                                                    # the names of the parts, in the corners of every page
  brief: the brief
  projects: the projects
  colophon: colophon

# ---------------------------------------------------------------------------------------------------------------
# The cover (index.html): written like the back of a book
cover:
  blurb_head: "Too many side projects. All of them on one record."   # the big line, like a back cover's teaser
  blurb: "By day, the platform that keeps Tencent's GPUs busy. By night, whatever won't leave me alone: a wallet that reads Malaysian bank statements, a trading system my own red team took apart, a robot that learns from a few demonstrations."
                                                        # the back-cover paragraph under it (DRAFT by Claude: rewrite in your voice)
  intro: "Each project sits on the record by the skills it took. Drag to spin it; click a name for its blurb."
                                                        # the small print: how to use the record
  door_brief: "The brief"                               # the two ways on, under the blurb
  door_brief_note: "thirty seconds, and the CV"
  door_projects: "The projects"
  door_projects_note: "{count} volumes, in depth"
  updated: "printed {date}"                             # the small print by the barcode at the foot of the blurb ({date} = last update)
  label_rim: "TEOH KAI SHUN · SIDE A · 33⅓ RPM · "      # printed round the record's centre label
  sleeve_heading: ON THE BACK                           # the small heading on a project's blurb
  read_more: "Read Vol. {vol}"                          # the button on a project's blurb
  directory:                                            # the line under each corner link on the cover ({count} = number of projects)
    projects: "{count} projects in depth, a record each"
    brief: who I am, the highlights and the CV
    colophon: last updated, and how this site is made

# ---------------------------------------------------------------------------------------------------------------
# The other pages
pages:
  contents_intro: "Every project is a record in its sleeve, numbered in the order I started it; a red label means it's still running. Pick one and it plays."
  author_intro: "The short version: who I am, what I'm proudest of, and the CV for the role you're hiring for."
  author_comment_label: 作者コメント · a word from the author
  brief_summary: in thirty seconds            # the heading over your summary
  highlights_heading: the highlights          # the heading over the projects you pick below
  highlights:                                 # the volumes to show on the brief, in order (ids from the table in GUIDE.md;
    - ai-platform                             #  a volume of several projects uses its volume id: ai-platform, neuromorphic)
    - kkp-wallet
    - tradingjoe
    - icl-hyperbolic
    - re-news
  years_heading: 年譜 · the years
  cv_heading: the CV                          # the second tab on the brief (the first is highlights_heading)
  cv_get: get the CV                          # over the PDF buttons beside the brief
  cv_pdf_link: download as PDF                # the button on each CV
  draft_note: Details are drafts until Kai Shun reviews this entry.   # under a volume's links while its entry is a draft
  updated: last updated {date}                # at the foot of every page, linking to the colophon

colophon:
  title: "Teoh Kai Shun: every project, big or small"
  sound: "The cover is a record playing whatever Kai Shun is listening to on Spotify, live, with each track's tempo from a bank of sources ranked by trust."
  updated: last updated                       # the first line of the colophon, before the date
  state: Live since 2026-10-20 and still being drawn. Details on most volumes are drafts until reviewed.

# ---------------------------------------------------------------------------------------------------------------
# Colours: a light and a dark palette. Any CSS colour works (#rrggbb is easiest).
colours:
  # Roles, not hues: `music` is what moves with the music (rim text, level bars, tonearm); `archive` is the
  # shelf bands, corner squares, panels and CV sheet; `mark` fills the caption boxes and hovers; `spot` is the one red, with `spot_edge` as its border.
  #
  # By part: each part of the site takes its colours from the ones above. To change one part only, add it under
  # light: or dark: with just the colours you want (anything left out keeps its default, shown here):
  #   record:      { grooves: tone, edge: ink, label_rim: ink }
  #   rim_player:  { track_text: music, level_bars: music }
  #   tonearm:     { arm: music }
  #   points:      { fallback: ink }      the stars on the record take the main colour of the cover playing;
  #                                       this is their colour when there's no cover, or it's all grey
  #   sleeve:      { paper: paper, border: ink, text: ink }
  #   shadows:     { shadow: ink, blot: ink }
  #   corners:     { triangles: archive, labels: ink, current: spot }
  #   live:        { red: spot, edge: spot_edge, text: spot, on_red: on_spot }
  #   shelf:       { running_band: archive, finished_band: archive }
  #   panels:      { border: archive, caption_box: mark, caption_text: on_mark }
  #   cv:          { paper: paper, border: archive, tabs: archive }
  # The page itself is paper, ink and muted. Example, under light:
  #   live:
  #     text: "#b03463"     # a darker red for words, so they pass contrast
  light:
    paper: "#f5ecdb"      # the page: warm beige
    ink: "#2a1b3d"        # lines, text: purple-black
    tone: "#b3a58f"       # grooves, faint lines
    soft: "#fbe9a6"       # hover fills: pale yellow
    muted: "#6b5a74"      # small print
    music: "#163a7a"      # deep blue
    archive: "#6a3fa0"    # purple
    mark: "#f4c430"       # saffron yellow
    on_mark: "#2a1b3d"    # text on yellow
    spot: "#d9507f"       # light raspberry: only what's live or chosen
    spot_edge: "#f2a7c0"  # pink border round the red
    on_spot: "#ffffff"    # text on red
    live:
      text: "#b03463"     # a darker red for words, so they pass contrast
  dark:
    paper: "#0c1511"      # green-black
    ink: "#e2ebe5"
    tone: "#66786d"
    soft: "#1a2620"
    muted: "#99aba0"
    music: "#7ea8d4"      # blue
    archive: "#74b592"    # green
    mark: "#74b592"
    on_mark: "#0c1511"
    spot: "#ff5a5f"
    spot_edge: "#ff5a5f"
    on_spot: "#0c1511"

# ---------------------------------------------------------------------------------------------------------------
# Music
music:
  # A playlist per project: clicking the project plays a song from it (its cover goes on the record).
  # The key is the project's id (GUIDE.md lists them all); the value is a Spotify playlist link.
  # Projects without one play whatever you're playing now.
  playlists:
    # kkp-wallet: https://open.spotify.com/playlist/xxxxxxxxxxxxxxxxxxxxxx

  # Artists who never show on the site.
  hide_artists: []
    # - Some Artist

  # Your own tempo for a track, by Spotify track link. It wins over every other source.
  # (These two live in the worker: after changing them, run `npm run deploy` in worker/. GUIDE.md, "Music".)
  bpm:
    # https://open.spotify.com/track/4iaPbB3jH6NGKhSVjETPwG: 96
