# Volume for the Tencent model-deployment platform: bank/experience/tencent.md (What it is, Story) and the five work
# items it folds in. Panel text comes from those entries; captions are editorial. No internal names, ever.
id: ai-platform
entry: tencent
members: [tencent-autoscaler, tencent-models, tencent-hardening, tencent-multitenancy, tencent-maintainability]
title: AI Model Deployment Platform
tagline: The platform that deploys, scales and tears down GPU model serving for several business units
kana: モデル基盤
obi: The log of what fired is the lock.
cover: lock
episodes:
  - n: 1
    title: Inheriting the platform
    panels:
      - span: 4
        art: racks
        caption: The platform
        text: The team's model-serving platform deploys, scales, health-checks and tears down GPU model-serving services on Kubernetes for several business units, 50+ services on well over 1,000 GPUs. I build the platform; other teams run the GPUs and the services on it.
      - span: 2
        art: commits
        caption: The handover in
        text: The codebase dates from 2024. I joined in March 2026, and by October I had written about 450 of its 550 commits.
  - n: 2
    entry: tencent-autoscaler
    title: GPUs that keep time
    panels:
      - span: 6
        art: clock
        caption: The idea
        text: Built from scratch, starting on 30 March 2026. Inference services scale their GPUs up and down on a daily schedule, with schedules checked for conflicts and a scheduler that fires several configs per tick.
      - span: 3
        art: lock
        caption: Exactly once
        text: The scheduler runs on every replica. Redis or ZooKeeper would have been a new dependency for one feature, so a UNIQUE constraint on the execution log is the lock. One INSERT wins; the rest get a duplicate key and skip.
      - span: 3
        art: twostep
        caption: Two steps
        text: A design choice, asked for in May. Asking a shared cluster for every GPU at once can starve other workloads or fail on the last few replicas. So scale-up takes 80% first, waits for it to be ready, then asks for the rest.
      - span: 4
        art: history
        caption: The record
        text: GPU usage history in 30-minute snapshots, and fixed GPU accounting behind the resource reports.
      - span: 2
        art: reconcile
        caption: Clean-up
        text: Reconciliation turns off schedules whose services have gone.
  - n: 3
    entry: tencent-models
    title: Which model, which GPU
    panels:
      - span: 3
        art: gpu
        caption: The bill
        text: GPU usage totals per project and per service group, first as two API calls, then refactored into one.
      - span: 3
        art: versus
        caption: The right versions
        text: Each service is bound to the model versions it can be updated to, so an update only offers valid models.
      - span: 6
        art: k8s
        caption: Where it lands
        text: Deploys from GPU-type templates, the GPU cards each template supports, cluster and namespace selection, and model-version search. And a fix for the platform taking services offline whenever its own access to the cluster manager was refused.
  - n: 4
    entry: tencent-hardening
    title: Bugs that make no noise
    panels:
      - span: 6
        art: postmortem
        caption: Three spare weeks
        text: In July the frontend's schedule slipped, so I audited the server end to end. About 30 defects found and fixed between 9 July and 11 August, each written up with its cause and fix, then tested and merged to production on 17–19 August.
      - span: 3
        art: ghost
        caption: Offline, still running
        text: Two status constants had been copied the wrong way round, so the scheduler could scale an offline service back up. On one call path, taking a service offline did nothing at all and still returned success.
      - span: 3
        art: guards
        caption: The clean-up that never ran
        text: The rollback after a failed deploy only deleted zero-replica deployments, so it was refused on every real deploy, and the GPU leak it existed to stop happened every time.
      - span: 4
        art: table
        caption: Ten models
        text: "\"The TTS model is missing from the wizard\" was a hard-coded LIMIT 10. And a duplicate job ID hid a whole service group, because MySQL treats every NULL deleted_at as distinct."
      - span: 2
        art: timeout
        caption: Guards
        text: An empty config push can no longer wipe the templates and cluster credentials. The Kubernetes client rebuilds itself when its token expires, and one slow cluster no longer hangs every list.
      - span: 3
        art: token
        caption: Keys out of the code
        text: The object-storage keys and the cluster manager's API token used to sit in the source. Now the config centre and the cluster credentials deliver them, the server won't start without them, and the keys that had been committed were rotated.
      - span: 3
        art: reconcile
        caption: Both ends
        text: In November, still in testing. A deploy now finishes its database write even past the request's deadline, and a sweep removes Deployments no service row points to. The orphaned-GPU leak is closed from both ends.
      - span: 4
        art: copy
        caption: The copy that broke everything
        text: Later, one version of cloning refused any copy whose saved config held values the template no longer declared. Correct in principle, it broke every real copy within 24 hours. I reverted it to report those values instead, and kept the principle.
      - span: 2
        art: revert
        caption: 24 hours
        text: A copy replays the service; it doesn't copy the row.
  - n: 5
    entry: tencent-multitenancy
    title: Whose config is it?
    panels:
      - span: 6
        art: tenants
        caption: The job
        text: From 19 August to 30 September 2026, turned a single-tenant deployment platform into a multi-tenant one, so several business units and their app groups share it. Every query is scoped by business unit with ownership checks, and environment tags are bound to the clusters each tenant may deploy into.
      - span: 3
        art: missingdir
        caption: The guess
        text: The obvious way to pick a tenant's config was to join two request labels into a directory name. On the live payload that resolved to a directory that doesn't exist, and nothing reported the failure.
      - span: 3
        art: table
        caption: The fix
        text: Tenancy now comes from an explicit table keyed on the ID pair every request carries. An undeclared tenant is refused, never served someone else's templates.
      - span: 6
        art: pin
        caption: Don't rebuild it
        text: I rejected a server-side config-merge layer, because the company's config system already copies shared config into each tenant's group. As a bonus, each tenant can pin a known-good version.
  - n: 6
    entry: tencent-maintainability
    title: For the next person
    panels:
      - span: 3
        art: commits
        caption: Less code
        text: A four-phase refactor splitting monolith handlers into packages, shorter modular functions, and dead code removed.
      - span: 3
        art: trace
        caption: Readable logs
        text: Request-ID tracing across every RPC and logs that say what they mean, plus the team's protocol for moving config changes between dev and prod, both ways.
      - span: 6
        art: handover
        caption: The handover out
        text: The platform's bilingual (English and Chinese) handover. Runtime view, release and rollback, eleven recorded design decisions, a runbook, and the known debt.
