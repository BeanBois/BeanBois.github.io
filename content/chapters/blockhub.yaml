# Volume for bank/projects/blockhub.md. Panel text from that entry; captions editorial.
entry: blockhub
kana: ブロック
obi: Social good, read differently.
cover: trophy
episodes:
  - n: 1
    title: A different social good
    panels:
      - span: 4
        art: vote
        caption: The theme
        text: The hackathon asked for blockchain for social good. I read it as open source, software everyone uses that struggles to reach the developers it needs.
      - span: 2
        art: pitch
        caption: My idea
        text: I came up with it and pitched it to my team of six. Their feedback made it a better product.
      - span: 3
        art: platform
        caption: The platform
        text: Open-source projects reach potential contributors, and contributors vote on-chain to rank projects, so the ones judged most impactful draw the most help. A major contributor gets a Polygon ID certificate to prove it anywhere on Polygon.
      - span: 3
        art: trophy
        caption: 1st of 50+
        text: I led most of the design, then worked across the backend and frontend. In October 2022 it won the Polygon × EasyA hackathon as the best overall project built on Polygon, and 5,000 USD.
