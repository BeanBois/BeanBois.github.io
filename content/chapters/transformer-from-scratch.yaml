    panels:
      - span: 3
        art: attention
        caption: The model
        text: The original Transformer, encoder, decoder and attention, reimplemented from the paper in PyTorch, with training and evaluation scripts.
      - span: 3
        art: subtitles
        caption: The data
        text: A learning exercise. Given one line of Archer, predict the next, trained on fourteen seasons of subtitles. Training loss fell from 7.5 to 4.4 over 200 epochs.
