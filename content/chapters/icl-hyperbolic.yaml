# Volume for bank/research/icl-hyperbolic.md (the MSc thesis, the_final_report.pdf). Panel text from that entry; captions editorial.
entry: icl-hyperbolic
title: Instant Policy++
kana: 双曲
obi: The baseline won. The write-up says why.
cover: poincare
episodes:
  - n: 1
    title: The bet
    panels:
      - span: 6
        art: demos
        caption: The setting
        text: My MSc thesis at Imperial, supervised by Dr Edward Johns. Instant Policy teaches a robot a new task from one or two demonstrations, framed as graph generation with diffusion.
      - span: 3
        art: poincare
        caption: Trees in a ball
        text: A demonstration has a tree shape (a task splits into sub-goals, sub-goals into moves), and hyperbolic space holds trees with little distortion. So a second, hyperbolic channel carries the hierarchy, next to the Euclidean one for local geometry.
      - span: 3
        art: sarkar
        caption: No training
        text: Demonstrations are clustered into action trees by angle, keeping time order, and embedded with Sarkar's construction. Low distortion, and the hyperbolic norms don't blow up.
      - span: 4
        art: product
        caption: Both geometries
        text: A product-manifold attention module lets the current observation attend to the demonstrations in both geometries. Actions are predicted as flows and denoised with DDIM.
      - span: 2
        art: dual
        caption: Two channels
        text: Euclidean for where things are, hyperbolic for what belongs to what.
  - n: 2
    title: A world to test it in
    panels:
      - span: 3
        art: to2d
        caption: From 3D to 2D
        text: The work started on RLBench in 3D and moved within ten days to a 2D game made for the purpose. Trained on Imperial's GPU cluster.
      - span: 3
        art: fourtasks
        caption: Four tasks
        text: Reach the goal, eat all edibles, push and place, and parking. Pseudo-demonstrations are generated continuously, and a collector records human ones.
      - span: 6
        art: versus
        caption: The baseline, rebuilt
        text: I re-implemented Instant Policy as the baseline, with a 2D geometry encoder in place of PointNet++.
  - n: 3
    title: The result, and why
    panels:
      - span: 4
        art: lost
        caption: It lost
        text: 2 of 10 against the baseline's 5 on reach-goal, 1 against 3 on eat-all-edibles, and 0 for both on the two hard tasks.
      - span: 2
        art: probe
        caption: The probe
        text: A linear probe on the hyperbolic embeddings predicts the next action worse than a bigram, 18.5% against 36.6%.
      - span: 3
        art: downsample
        caption: My mistake too
        text: In the baseline I downsampled demonstrations evenly instead of keeping the important frames, which made the policies oscillate. The thesis says so.
      - span: 3
        art: poincare
        caption: What next
        text: Instant Policy learns local dynamics end to end; the tree embedding didn't carry them. Next would be tree-structured demonstration signatures, with graphs generated from low to high resolution.
